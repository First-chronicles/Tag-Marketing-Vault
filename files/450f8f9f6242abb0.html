<title>Pipeliners Search Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,600..800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style id="css">
:root{
  --ground:#EEF2F6; --surface:#FFFFFF; --surface-2:#F5F8FB; --line:#D8E0E8; --line-2:#C3CFDB;
  --ink:#0F2338; --ink-2:#44576B; --ink-3:#66788C;
  --brand:#173E66; --brand-ink:#F2F6FA; --spark:#E0612C;
  --good:#1D7F47; --good-bg:#E2F2E9; --warn:#8E5300; --warn-bg:#FBEFD9;
  --info:#1F66B8; --info-bg:#E2EDFA; --mute:#56687B; --mute-bg:#E7ECF2;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0C141D; --surface:#132030; --surface-2:#172738; --line:#243649; --line-2:#33495F;
  --ink:#E8EEF5; --ink-2:#AAB8C7; --ink-3:#8494A6;
  --brand:#12314F; --brand-ink:#E8EEF5; --spark:#FF8A5C;
  --good:#5BC98E; --good-bg:#12342A; --warn:#F2B544; --warn-bg:#3A2C12;
  --info:#7DB2F0; --info-bg:#14304F; --mute:#A3B1C0; --mute-bg:#1E2D3E;
}}
:root[data-theme="dark"]{
  --ground:#0C141D; --surface:#132030; --surface-2:#172738; --line:#243649; --line-2:#33495F;
  --ink:#E8EEF5; --ink-2:#AAB8C7; --ink-3:#8494A6;
  --brand:#12314F; --brand-ink:#E8EEF5; --spark:#FF8A5C;
  --good:#5BC98E; --good-bg:#12342A; --warn:#F2B544; --warn-bg:#3A2C12;
  --info:#7DB2F0; --info-bg:#14304F; --mute:#A3B1C0; --mute-bg:#1E2D3E;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--info)}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:21px;font-weight:760;font-stretch:86%}
h3{font-size:17px;font-weight:720;font-stretch:86%}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{background:var(--brand);color:var(--brand-ink)}
header.top .wrap{padding-top:20px;padding-bottom:20px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between}
.eyebrow{display:flex;gap:10px;align-items:center;font:600 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.eyebrow i{width:20px;height:6px;border-radius:3px;background:var(--spark);display:inline-block}
header h1{font-size:34px;font-weight:800;font-stretch:78%;margin-top:6px}
header a{color:var(--brand-ink);font-size:13px;border:1px solid rgba(255,255,255,.32);border-radius:999px;padding:5px 11px;text-decoration:none;white-space:nowrap}
header a:hover{background:rgba(255,255,255,.1)}

main{padding-top:22px;padding-bottom:96px;display:flex;flex-direction:column;gap:26px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;margin-bottom:10px}
.sec-head p{color:var(--ink-2);font-size:14px}

/* this week */
.who{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
@media (max-width:720px){.who{grid-template-columns:1fr}}
.who-col{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.who-col + .who-col{border-left:1px solid var(--line)}
@media (max-width:720px){.who-col + .who-col{border-left:0;border-top:1px solid var(--line)}}
.who-col .role{font-size:12.5px;color:var(--ink-3);margin-top:-4px}
.who-col ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.who-col li{font-size:14px;line-height:1.35;display:flex;gap:8px}
.who-col li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--spark);margin-top:6px}
.who-col li.wait::before{background:var(--line-2)}
.who-col li small{display:block;color:var(--ink-3);font-size:12px}
.who-col .empty{font-size:13.5px;color:var(--ink-3)}

/* strip: dates + score */
.strip{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.strip{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.panel h3{font-size:15px;margin-bottom:8px}
.dates{list-style:none;margin:0;padding:0}
.dates li{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;align-items:baseline}
.dates li:first-child{border-top:0}
.dates .d{font:600 12.5px/1.4 var(--mono)}
.dates .in{font-size:12px;color:var(--ink-3);white-space:nowrap}
.dates li.key .d,.dates li.key .n{color:var(--spark);font-weight:600}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.score div{display:flex;flex-direction:column;gap:2px}
.score b{font:800 30px/1 var(--display);font-stretch:80%}
.score span{font-size:12.5px;color:var(--ink-3);line-height:1.3}
.score-note{font-size:12.5px;color:var(--ink-2);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}

/* plan */
.plan-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between;margin-bottom:10px}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.progress .bar{width:140px;height:8px;border-radius:4px;background:var(--mute-bg);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--good)}
.phase{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.phase + .phase{margin-top:14px}
.phase > header{display:flex;align-items:baseline;gap:10px;padding:11px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.phase > header span{font-size:13px;color:var(--ink-3)}
.step{display:grid;grid-template-columns:minmax(0,1fr) auto 140px;gap:6px 14px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
@media (max-width:640px){.step{grid-template-columns:minmax(0,1fr) auto}.step .st{grid-column:1 / -1;justify-self:start}}
.step .t{font-weight:600;font-size:15px;line-height:1.35}
.step .w{display:block;font-weight:400;font-size:13.5px;color:var(--ink-2);margin-top:2px}
.step.is-done .t,.step.is-skipped .t{color:var(--ink-3)}
.owner{font:600 12px/1.5 var(--body);padding:2px 9px;border-radius:999px;white-space:nowrap}
.o-kim{background:var(--warn-bg);color:var(--warn)}
.o-scott{background:var(--info-bg);color:var(--info)}
.o-claude{background:var(--mute-bg);color:var(--ink-2)}
.st{position:relative;width:140px;justify-self:end}
.st::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);pointer-events:none}
.st select{appearance:none;-webkit-appearance:none;width:100%;border:0;border-radius:999px;padding:5px 26px 5px 12px;font:600 12.5px/1.3 var(--body);cursor:pointer}
.st select:disabled{cursor:default}
.st select option{color:var(--ink);background:var(--surface)}
.st.changed select{box-shadow:0 0 0 2px var(--spark)}
.s-todo{background:var(--mute-bg);color:var(--mute)}
.s-ok{background:var(--warn-bg);color:var(--warn)}
.s-wait{background:var(--mute-bg);color:var(--ink-3)}
.s-doing{background:var(--info-bg);color:var(--info)}
.s-done{background:var(--good-bg);color:var(--good)}
.s-skipped{background:var(--mute-bg);color:var(--ink-3)}
label.st{background:transparent}
.ro-note{font-size:13px;color:var(--warn);background:var(--warn-bg);padding:4px 10px;border-radius:6px}

.fine{font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:5px}
.fine a{color:var(--ink-2)}

.savebar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(620px,calc(100% - 24px));background:var(--ink);color:var(--ground);border-radius:10px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 28px rgba(0,0,0,.25);z-index:20;font-size:14px}
.savebar .msg{flex:1;min-width:0}
.savebar .msg small{display:block;opacity:.75;font-size:12px}
.savebar button{border:0;border-radius:7px;padding:8px 14px;font-weight:600;cursor:pointer}
.savebar .ghost{background:transparent;color:var(--ground);border:1px solid currentColor;opacity:.8}
.savebar .primary{background:var(--spark);color:#fff}
.savebar button:disabled{opacity:.55;cursor:default}
</style>

<div id="root"></div>

<script type="application/json" id="plan-state">{"updated":"2026-09-16","statuses":{"4":"done","5":"done","6":"done","7":"done","8":"done"}}</script>

<script id="app">
(function(){
  var CSS = document.getElementById('css').textContent;
  var APP = document.getElementById('app').textContent;
  var STATE = JSON.parse(document.getElementById('plan-state').textContent || '{}');
  STATE.statuses = STATE.statuses || {};

  var STATUS = {todo:'To do', ok:'Needs OK', wait:'Waiting', doing:'In progress', done:'Done', skipped:'Skipped'};
  var ORDER = ['todo','ok','wait','doing','done','skipped'];
  var ROLE = {Kim:'Approves', Scott:'Confirms facts, asks for reviews', Claude:'Does the work once approved'};

  var PHASES = [
    {id:'now', name:'This week', note:'Sep 14 – 20'},
    {id:'next', name:'Next', note:'By Oct 4'},
    {id:'later', name:'Later', note:'After the Oct 9 review'},
    {id:'done', name:'Done', note:'Sep 12'}
  ];

  // [id, phase, title, why, owner, default status, waiting-on]
  var S = [
    ['1','now','Confirm the real services','12 of 23 services on your Google listing aren’t yours (faucets, toilets, water heaters, sump pumps…).','Scott','ok',''],
    ['2','now','Fix the Google listing','Remove the wrong services, add Hydro Jetting, take out “pipe bursting”.','Claude','wait','After step 1'],
    ['3','now','Ask every customer for a review','No new reviews since Jul 5. Recent reviews help map rankings most.','Scott','todo',''],
    ['4','now','Post one job photo a week','Nothing posted since Jul 7.','Kim','todo',''],
    ['5','now','Fix the sitemap and ask Google to index 3 pages','Remove 5 hidden pages and 2 dead sitemaps; no other page is affected.','Kim','ok',''],
    ['6','now','Buckeye: add pipe-break text back','Live Sep 16: new pipe break section + 1 FAQ. Check again Sep 30.','Claude','wait','After Sep 16'],
    ['7','next','New titles for Florence, Fort McDowell, Maricopa, Litchfield Park','Live Sep 16 on Fort McDowell, Maricopa, Litchfield Park. Florence kept: its title was already right.','Kim','ok',''],
    ['8','next','Move Tempe, Mesa, Gilbert, Fountain Hills to page 1','Live Sep 16: new titles, H1s and descriptions, a question-and-answer section on each page, 7 links from nearby city pages. First check Oct 9.','Claude','todo',''],
    ['9','next','Switch the listing link to https','Half your Google clicks come through it; our reports can’t see them.','Kim','ok',''],
    ['10','next','Remove hidden homepage links; lock OTTO’s queue','122 hidden links (19 broken) and 1,234 unreviewed suggestions.','Kim','ok',''],
    ['11','next','Rewrite the leak detection page','77% is copied from another page, so Google ignores it.','Scott','wait','Scott confirms what leak work you do'],
    ['12','later','Stronger service pages with real job photos','Trenchless lining, ePIPE, hydro jetting. Real local proof is what ranks now.','Claude','todo',''],
    ['13','later','Get listed on “best in Phoenix” sites and match Yelp, Angi, BBB','AI answers quote these sites more than your website.','Claude','todo',''],
    ['14','later','Speed up the site on phones','No page is rated fast on mobile; the homepage is 21.5 MB.','Claude','todo',''],
    ['15','later','Merge weak blog posts','How-to articles get views but almost no clicks.','Kim','ok',''],
    ['16','done','Hidden text removed from 36 pages','','Claude','done',''],
    ['17','done','Phone buttons dial on 3 pages','','Claude','done',''],
    ['18','done','Wrong business code removed','','Claude','done','']
  ];
  var STEPS = S.map(function(r){return {id:r[0],phase:r[1],title:r[2],why:r[3],owner:r[4],def:r[5],wait:r[6]};});

  var DATES = [
    ['2026-09-16','Buckeye check',''],
    ['2026-09-24','Site-wide check',''],
    ['2026-09-30','Buckeye 4-week check',''],
    ['2026-10-09','Review: did it work?','key'],
    ['2026-10-11','Final numbers pulled','']
  ];

  var pending = {}, canSave = null, readOnly = false, ns = null;

  function statusOf(s){ return pending[s.id] || STATE.statuses[s.id] || s.def; }
  function savedOf(s){ return STATE.statuses[s.id] || s.def; }
  function esc(x){ return String(x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function day(s){ var p=s.split('-'); return Date.UTC(+p[0],+p[1]-1,+p[2]); }
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmt(s){ var d=new Date(day(s)); return MON[d.getUTCMonth()]+' '+d.getUTCDate(); }
  function todayISO(){ var n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); }
  function open(st){ return st!=='done' && st!=='skipped'; }

  function header(){
    return '<header class="top"><div class="wrap"><div><div class="eyebrow"><i></i>Pipeliners · pipelinersusa.com</div><h1>Search Plan</h1></div>'+
      '<a href="https://claude.ai/code/artifact/a54ea686-242d-491b-a3b2-870f547601a4" target="_blank" rel="noopener">See the baseline numbers ↗</a></div></header>';
  }

  function thisWeek(){
    var cols = ['Kim','Scott','Claude'].map(function(o){
      var items = STEPS.filter(function(s){ return s.owner===o && s.phase==='now' && open(statusOf(s)); });
      var li = items.map(function(s){
        var st = statusOf(s), w = st==='wait';
        return '<li class="'+(w?'wait':'')+'"><span>'+esc(s.title)+(w&&s.wait?'<small>'+esc(s.wait)+'</small>':'')+'</span></li>';
      }).join('');
      return '<div class="who-col"><h3>'+o+'</h3><p class="role">'+ROLE[o]+'</p>'+(items.length?'<ul>'+li+'</ul>':'<p class="empty">Nothing this week.</p>')+'</div>';
    }).join('');
    return '<section aria-labelledby="h1w"><div class="sec-head"><h2 id="h1w">This week</h2><p>Who needs to do what.</p></div><div class="who">'+cols+'</div></section>';
  }

  function strip(){
    var t = day(todayISO());
    var li = DATES.map(function(d){
      var n = Math.round((day(d[0])-t)/86400000);
      var inTxt = n<0?'Done':(n===0?'Today':(n===1?'Tomorrow':'in '+n+' days'));
      return '<li class="'+d[2]+'"><span class="d">'+fmt(d[0])+'</span><span class="n">'+esc(d[1])+'</span><span class="in">'+inTxt+'</span></li>';
    }).join('');
    return '<div class="strip">'+
      '<div class="panel"><h3>Key dates</h3><ul class="dates">'+li+'</ul></div>'+
      '<div class="panel"><h3>How we’ll know it worked</h3><div class="score">'+
        '<div><b class="num">36</b><span>clicks from people who didn’t search “Pipeliners”</span></div>'+
        '<div><b class="num">63</b><span>calls, visits and directions from the listing</span></div>'+
        '<div><b class="num">6</b><span>leads recorded</span></div>'+
      '</div><p class="score-note">Starting numbers (Aug 14 – Sep 10). On Oct 9 we want all three higher.</p></div>'+
    '</div>';
  }

  function plan(){
    var done = STEPS.filter(function(s){return statusOf(s)==='done';}).length;
    var note = readOnly ? '<span class="ro-note">View only. Ask Kim to update.</span>' : (canSave===false ? '<span class="ro-note">Changes save only on the published page.</span>' : '');
    var phases = PHASES.map(function(p){
      var steps = STEPS.filter(function(s){return s.phase===p.id;});
      var rows = steps.map(function(s){
        var st = statusOf(s), changed = pending[s.id] && pending[s.id]!==savedOf(s);
        var opts = ORDER.map(function(k){return '<option value="'+k+'"'+(k===st?' selected':'')+'>'+STATUS[k]+'</option>';}).join('');
        return '<div class="step is-'+st+'"><div class="t">'+esc(s.title)+(s.why?'<span class="w">'+esc(s.why)+'</span>':'')+'</div>'+
          '<span class="owner o-'+s.owner.toLowerCase()+'">'+s.owner+'</span>'+
          '<label class="st'+(changed?' changed':'')+'"><span hidden>Status of step '+s.id+'</span><select class="s-'+st+'" data-id="'+s.id+'"'+(readOnly?' disabled':'')+'>'+opts+'</select></label></div>';
      }).join('');
      return '<article class="phase" aria-labelledby="ph-'+p.id+'"><header><h3 id="ph-'+p.id+'">'+p.name+'</h3><span>'+p.note+'</span></header>'+rows+'</article>';
    }).join('');
    return '<section aria-labelledby="hpl"><div class="plan-head"><h2 id="hpl">The plan</h2>'+note+
      '<div class="progress"><span>'+done+' of '+STEPS.length+' done</span><div class="bar"><i style="width:'+(done/STEPS.length*100)+'%"></i></div></div></div>'+phases+'</section>';
  }

  function fine(){
    return '<div class="fine"><span>Change a status and press Save to update it for everyone. Nothing goes live on the site without Kim’s OK.</span>'+
      '<span>Based on Google’s own 2026 guidance (<a href="https://developers.google.com/search/docs/fundamentals/ai-optimization-guide" target="_blank" rel="noopener">AI search</a>, <a href="https://status.search.google.com/products/rGHU1u87FJnkP6W2GwMi/history" target="_blank" rel="noopener">updates</a>) and <a href="https://whitespark.ca/local-search-ranking-factors/" target="_blank" rel="noopener">Whitespark’s 2026 local ranking study</a>. Last saved '+fmt(STATE.updated||'2026-09-14')+'.</span></div>';
  }

  function saveBar(){
    var n = Object.keys(pending).length;
    if (!n || readOnly) return '';
    var btn = canSave===true ? '<button type="button" class="primary" id="save">Save</button>' : (canSave===null ? '<button type="button" class="primary" disabled>Connecting…</button>' : '');
    return '<div class="savebar" role="status"><div class="msg">'+n+' unsaved change'+(n>1?'s':'')+'<small id="savemsg">'+(canSave===false?'Saving isn’t available here.':'Everyone will see the new statuses.')+'</small></div>'+
      '<button type="button" class="ghost" id="discard">Discard</button>'+btn+'</div>';
  }

  function render(){
    var y = window.scrollY;
    document.getElementById('root').innerHTML = header()+'<main class="wrap">'+thisWeek()+strip()+plan()+fine()+'</main>'+saveBar();
    window.scrollTo(0,y);
  }

  function buildDoc(state){
    var json = JSON.stringify(state).replace(/</g,'\\u003c');
    var X = 'scr'+'ipt';
    return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+
      '<title>Pipeliners Search Plan</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'+
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,600..800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">'+
      '<style id="css">'+CSS+'</style></head><body><div id="root"></div>'+
      '<'+X+' type="application/json" id="plan-state">'+json+'</'+X+'>'+
      '<'+X+' id="app">'+APP+'</'+X+'></body></html>';
  }

  function msg(t){ var m=document.getElementById('savemsg'); if (m) m.textContent=t; }

  function save(){
    if (!ns) return;
    var b = document.getElementById('save'); if (b){ b.disabled=true; b.textContent='Saving…'; }
    var next = {updated: todayISO(), statuses: Object.assign({}, STATE.statuses, pending)};
    (function attempt(retried){
      ns.publish(buildDoc(next)).then(function(){ msg('Saved. Reloading…'); }).catch(function(err){
        var c = err && err.code;
        if (c==='conflict'){ msg('Someone saved a newer version. Loading it now.'); return; }
        if (['not_writer','not_granted','consent_required','capability_disabled','capability_removed','not_declared'].indexOf(c)>-1){ readOnly=true; pending={}; render(); return; }
        if (c==='upstream_error' && !retried){ setTimeout(function(){attempt(true);}, 800+Math.random()*1200); return; }
        if (b){ b.disabled=false; b.textContent='Save'; }
        msg(c==='rate_limited' ? 'Saving too often. Wait a minute, then try again.' : 'Couldn’t save right now. Your changes are still here; try again.');
      });
    })(false);
  }

  document.addEventListener('change', function(e){
    var sel = e.target.closest && e.target.closest('select[data-id]');
    if (!sel) return;
    var s = STEPS.filter(function(x){return x.id===sel.dataset.id;})[0];
    if (sel.value===savedOf(s)) delete pending[s.id]; else pending[s.id]=sel.value;
    render();
  });
  document.addEventListener('click', function(e){
    if (e.target.id==='discard'){ pending={}; render(); }
    else if (e.target.id==='save'){ save(); }
  });

  render();
  if (window.claude && typeof window.claude.use==='function'){
    window.claude.use('artifact').then(function(x){ ns=x; canSave=!!x; render(); }).catch(function(){ canSave=false; render(); });
  } else { canSave=false; }
})();
</script>
