<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>



<title>TAG Search Visibility Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;600;700&display=swap">
<style>
/* Layout: classroom-style shell. White header names the client and holds the time window, underline tabs pick the report; a thin icon rail switches clients; content sits in plain white cards on a light grey canvas. */
:root {
  color-scheme: light;
  --canvas: #f7f7f5;
  --surface: #ffffff;
  --surface-2: #f2f2ef;
  --surface-3: #e9e9e5;
  --line: #e6e6e2;
  --line-2: #d7d7d2;
  --axis: #cfcfc9;
  --ink: #18191b;
  --ink-2: #4a4b4f;
  --muted: #817e77;
  --brand: #ff5c00;
  --brand-ink: #b84200;
  --brand-soft: #fff1e6;
  --series: #ff5c00;
  --base: #d3d1cb;
  --other: #d3d1cb;
  --up: #12a150;
  --down: #e5484d;
  --good: #12a150;
  --warn: #f5a524;
  --crit: #e5484d;
  --good-ink: #0b7a3b;
  --good-soft: #e1f3e6;
  --bad-ink: #b8242a;
  --bad-soft: #fce6e5;
  --amber-ink: #7a5200;
  --amber-soft: #fbefd4;
  --blue-ink: #1f5fa8;
  --blue-soft: #e2edf9;
  --plate: #ffffff;
  --scrim: rgba(12, 13, 15, .45);
  --shadow: none;
  --shadow-lg: 0 12px 40px rgba(12, 13, 15, .22);
  /* rail stays graphite in both themes */
  --side: #141517;
  --side-2: #1f2023;
  --side-3: #2a2b2f;
  --side-ink: #efede8;
  --side-muted: #8e8c86;
  --side-line: #2a2b30;
  --side-up: #5ee08f;
  --side-up-bg: rgba(46, 191, 108, .14);
  --side-down: #ff8a8e;
  --side-down-bg: rgba(255, 99, 105, .14);
  --font-display: "Calibre", "Roboto", system-ui, "Segoe UI", sans-serif;
  --font-ui: "Roboto", system-ui, "Segoe UI", Arial, sans-serif;
  --font-label: "Roboto Condensed", "Roboto", system-ui, sans-serif;
  --font-data: "Roboto Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 12px;
  --r-sm: 8px;
}
* { box-sizing: border-box; }
body { background: var(--canvas); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.01em; font-family: var(--font-display); color: var(--ink); }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num, td.n, .delta, .chip, .pv, .hrow .v, .drow .v, .kpi .v, .hero-n .v b, .mini .v { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-data); font-size: 12px; }
select, input[type=search], input[type=text], input[type=date], textarea { background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 7px 10px; font: inherit; font-size: 13px; }
select { padding-right: 28px; max-width: 100%; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 88px minmax(0, 1fr); min-height: 100vh; }
.content { min-width: 0; display: flex; flex-direction: column; }
.rail { position: sticky; top: 0; height: 100vh; background: var(--canvas); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 10px; padding: calc(16px + env(safe-area-inset-top, 0px)) 0 16px; z-index: 12; }
.rail-mark { width: 44px; height: 44px; display: grid; place-items: center; margin-bottom: 6px; background: var(--side); border-radius: 12px; }
.rail-mark img { width: 28px; height: 28px; }
#nav { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.rail-sep { width: 28px; height: 1px; background: var(--line-2); margin: 2px 0; }
.railbtn { border: 0; background: none; padding: 0; cursor: pointer; display: grid; justify-items: center; gap: 5px; width: 76px; }
.rb-icon { position: relative; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.rb-icon img { width: 30px; height: 30px; object-fit: contain; border-radius: 6px; }
.rb-icon .glyph { color: var(--ink-2); display: grid; place-items: center; }
.rb-icon .glyph svg { width: 18px; height: 18px; }
.rb-name { font-size: 11px; line-height: 1.2; font-weight: 500; color: var(--muted); text-align: center; max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.railbtn:hover .rb-icon { box-shadow: inset 0 0 0 1px var(--line-2); }
.railbtn:hover .rb-name { color: var(--ink); }
.railbtn[aria-current="page"] .rb-icon { box-shadow: inset 0 0 0 2px var(--ink); }
.railbtn[aria-current="page"] .rb-icon::before { content: ""; position: absolute; left: -18px; top: 8px; bottom: 8px; width: 4px; border-radius: 0 4px 4px 0; background: var(--ink); }
.railbtn[aria-current="page"] .rb-name { color: var(--ink); font-weight: 600; }
.rb-icon .dot { position: absolute; right: -8px; top: -7px; font-family: var(--font-data); font-size: 10px; font-weight: 500; line-height: 1; padding: 3px 5px; border-radius: 999px; background: var(--surface); color: var(--muted); box-shadow: 0 0 0 1px var(--line); }
.rb-icon .dot.up { color: var(--good-ink); background: var(--good-soft); box-shadow: none; }
.rb-icon .dot.down { color: #fff; background: var(--crit); box-shadow: none; }

/* ---------- sidebar ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.content { min-width: 0; display: flex; flex-direction: column; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px; padding: calc(18px + env(safe-area-inset-top, 0px)) 14px 16px; z-index: 12; }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 6px; }
.brand-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--side); display: grid; place-items: center; flex: none; }
.brand-mark img { width: 24px; height: 24px; }
.brand b { display: block; font-size: 15px; font-weight: 700; color: var(--ink); line-height: 1.2; }
.brand small { display: block; font-size: 12px; color: var(--muted); }
#nav { display: flex; flex-direction: column; align-items: stretch; gap: 2px; }
.navlbl { font-size: 12px; font-weight: 500; color: var(--muted); padding: 14px 10px 6px; }
.navbtn { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 10px; cursor: pointer; color: var(--ink-2); font-size: 14px; font-weight: 500; }
.navbtn:hover { background: var(--surface-2); color: var(--ink); }
.navbtn[aria-current="page"] { background: var(--brand-soft); color: var(--ink); font-weight: 600; }
.nlogo { width: 26px; height: 26px; border-radius: 7px; object-fit: contain; background: var(--plate); box-shadow: inset 0 0 0 1px var(--line); padding: 2px; flex: none; }
.nglyph { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); flex: none; }
.nglyph svg { width: 14px; height: 14px; }
.navbtn .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { font-family: var(--font-data); font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.up { color: var(--good-ink); background: var(--good-soft); }
.chip.down { color: var(--bad-ink); background: var(--bad-soft); }
.subnav { display: grid; gap: 1px; margin: 4px 0 8px 22px; padding-left: 12px; border-left: 1px solid var(--line-2); }
.subbtn { border: 0; background: none; text-align: left; padding: 6px 10px; border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 13px; }
.subbtn:hover { background: var(--surface-2); color: var(--ink); }
.subbtn[aria-current="true"] { color: var(--ink); font-weight: 600; background: var(--surface-2); }
.side-foot { margin-top: auto; display: grid; gap: 8px; font-size: 12px; color: var(--muted); padding: 14px 10px 0; border-top: 1px solid var(--line); }
.side-foot .navlbl { padding: 0; }
.side-foot p { margin: 0; }
.side-foot b { color: var(--ink-2); font-weight: 600; }
.srclist { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
.srclist li { display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
.srclist .ghl { width: 16px; height: 16px; border-radius: 4px; background: var(--plate); color: #1a73e8; font: 700 10px/16px var(--font-ui); text-align: center; box-shadow: inset 0 0 0 1px var(--line); flex: none; }
.srclist .ico { margin: 0; background: var(--plate); border-radius: 4px; padding: 1px; }
.top .tabs { display: none; }
.top-row { padding-bottom: 14px; }

/* header */
.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 8; padding-top: env(safe-area-inset-top, 0px); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 14px 32px 0; }
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-bottom: 12px; }
.who { display: flex; align-items: center; gap: 12px; min-width: 0; margin-right: auto; }
.who .logo { width: 40px; height: 40px; border-radius: 10px; background: var(--plate); box-shadow: inset 0 0 0 1px var(--line); display: grid; place-items: center; flex: none; }
.who .logo img { width: 32px; height: 32px; object-fit: contain; }
.who .logo .glyph svg { width: 18px; height: 18px; color: var(--ink-2); }
.who b { display: block; font-size: 18px; font-weight: 600; letter-spacing: -.01em; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { display: block; font-size: 12px; color: var(--muted); }
.top-act { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.menu { display: none; }
.scrim { display: none; }
.mbar { display: none; }
.seg { display: inline-grid; grid-auto-flow: column; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 10px; }
.seg button { position: relative; border: 0; background: none; color: var(--ink-2); border-radius: 7px; padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
.seg button b { font-weight: 600; }
.seg button:hover { color: var(--ink); }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08), inset 0 0 0 1px var(--line); }
.seg button[disabled] { cursor: progress; }
.seg .np { position: absolute; top: 4px; right: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); opacity: .5; }
.refbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: var(--ink); color: var(--canvas); border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
.refbtn:hover { background: var(--brand); color: #fff; }
.refbtn[disabled] { opacity: .7; cursor: progress; }
.refbtn .spin { width: 12px; height: 12px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.refmsg { margin: 0; font-size: 12px; line-height: 1.4; color: var(--muted); }
.refmsg.bad { color: var(--bad-ink); }
.ctx-msg { padding: 0 0 12px; }
.cform { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 18px; padding: 0 0 14px; }
.cform .grp { display: grid; gap: 6px; }
.cform .t { font-size: 12px; font-weight: 500; color: var(--muted); display: flex; gap: 8px; }
.cform .t em { font-style: normal; }
.cform .cdr { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.cform input[type=date] { padding: 5px 8px; font-size: 12px; }
.cform .quick { display: flex; flex-wrap: wrap; gap: 4px; }
.cform .quick button { border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.cform .quick button:hover, .cform .quick button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.cform .warn { margin: 0; font-size: 12px; color: var(--amber-ink); flex-basis: 100%; }
.cform select { font-size: 12px; }
.tabs { display: flex; gap: 28px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 6px 0 12px; cursor: pointer; color: var(--muted); font-weight: 500; font-size: 15px; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.foot { max-width: 1180px; width: 100%; margin: 0 auto; padding: 0 32px 40px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 12px; color: var(--muted); }
.foot .srclist { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0; list-style: none; }
.foot .srclist li { display: flex; align-items: center; gap: 6px; }
.foot .ghl { width: 16px; height: 16px; border-radius: 4px; background: var(--plate); color: #1a73e8; font: 700 10px/16px var(--font-ui); text-align: center; box-shadow: inset 0 0 0 1px var(--line); }
.foot .ico { margin: 0; background: var(--plate); border-radius: 4px; padding: 1px; }
.foot b { color: var(--ink-2); font-weight: 600; }
.ctx-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.ctx-cmp { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
.ctx-cmp i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }
.ctx-cmp b { font-weight: 600; color: var(--ink); }
.compare { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; margin-left: auto; }
.compare select { font-size: 13px; padding-block: 6px; }

main { max-width: 1180px; width: 100%; margin: 0 auto; padding-block: 28px 40px; padding-inline: 32px; display: flex; flex-direction: column; gap: 20px; }

/* ---------- page head ---------- */
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 20px; }
.eyebrow { font-size: 13px; font-weight: 500; color: var(--muted); }
.head h1 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; overflow-wrap: anywhere; }
.head .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.sitehead { display: flex; align-items: center; gap: 16px; min-width: 0; }
.sitehead > div { min-width: 0; display: grid; gap: 2px; }
.plate { background: var(--plate); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; display: grid; place-items: center; flex: none; }
.slogo { height: 40px; width: auto; max-width: 150px; object-fit: contain; display: block; }
.section-t { font-size: 17px; font-weight: 600; letter-spacing: -.01em; color: var(--ink); display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; margin-top: 14px; }
.section-t span { font-weight: 400; letter-spacing: 0; color: var(--muted); font-size: 13px; }
.legend-row { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); }
.legend-row i, .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.intro { display: grid; gap: 6px; }
.intro p { margin: 0; color: var(--ink-2); max-width: 90ch; }

/* findings */
.findings { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 20px; }
.findings summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: var(--ink); }
.findings summary::-webkit-details-marker { display: none; }
.findings summary::after { content: "Show"; margin-left: auto; font-family: var(--font-ui); font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); }
.findings[open] summary::after { content: "Hide"; }
.findings summary .n { font-family: var(--font-data); font-weight: 500; letter-spacing: 0; color: var(--muted); }
.findings ul { margin: 10px 0 4px; padding-left: 18px; display: grid; gap: 7px; color: var(--ink-2); max-width: 110ch; }
.findings li::marker { color: var(--brand); }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; box-shadow: var(--shadow); }
.card-h { display: grid; gap: 2px; padding: 20px 22px 0; }
.card-h h2 { font-size: 16px; font-weight: 600; }
.card-h .hint { font-size: 12px; color: var(--muted); }
.card-b { padding: 16px 22px 22px; }
.grid { display: grid; gap: 20px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }

/* stat strip: a row of KPI tiles reads as one instrument panel */
.grid:has(> .kpi) { gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.kpi { padding: 18px 22px; display: flex; flex-direction: column; gap: 4px; border: 0; border-radius: 0; box-shadow: none; }
.kpi .k { font-size: 13px; font-weight: 500; color: var(--muted); }
.kpi .v { font-size: 28px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; color: var(--ink); font-family: var(--font-display); }
.kpi .s { font-size: 12px; color: var(--muted); min-height: 20px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.delta { font-family: var(--font-data); font-size: 11px; font-weight: 500; white-space: nowrap; border-radius: 999px; padding: 1px 7px; }
.delta.up { color: var(--good-ink); background: var(--good-soft); }
.delta.down { color: var(--bad-ink); background: var(--bad-soft); }
.delta.flat { color: var(--muted); background: var(--surface-2); }
.dash { color: var(--muted); }
.note { font-size: 12px; color: var(--muted); margin: 0; max-width: 120ch; }
.note.bad { color: var(--bad-ink); }
.note .ico { vertical-align: -2px; }

/* ---------- charts ---------- */
.vbars { display: flex; align-items: flex-end; gap: 12px; height: 230px; border-bottom: 1px solid var(--axis); padding-top: 30px; position: relative; }
.vbars .grid-l, .pbars .grid-l { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
.vcol { flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; z-index: 1; }
.vcol .bar { width: min(48px, 64%); background: var(--series); border-radius: 5px 5px 0 0; min-height: 2px; }
.vcol .val { position: absolute; left: -6px; right: -6px; text-align: center; font-size: 13px; font-weight: 700; color: var(--ink); font-family: var(--font-data); }
.vcol:hover .bar, .vcol:focus-visible .bar { filter: brightness(.92); }
.vlabels { display: flex; gap: 12px; margin-top: 8px; }
.vlabels span { flex: 1 1 0; min-width: 0; text-align: center; font-size: 11px; color: var(--ink-2); line-height: 1.25; }
.vlabels .ico { margin: 0 0 3px; background: var(--plate); border-radius: 4px; }
.pbars { display: flex; align-items: flex-end; gap: 18px; height: 250px; border-bottom: 1px solid var(--axis); padding-top: 32px; position: relative; }
.pgrp { flex: 1 1 0; min-width: 0; height: 100%; display: flex; justify-content: center; align-items: flex-end; gap: 6px; position: relative; z-index: 1; }
.pcol { width: min(28px, 40%); height: 100%; display: flex; flex-direction: column; justify-content: flex-end; position: relative; }
.pcol .bar { border-radius: 5px 5px 0 0; min-height: 2px; }
.pcol.b .bar { background: var(--base); }
.pcol.n .bar { background: var(--series); }
.pcol .val { position: absolute; left: -18px; right: -18px; text-align: center; font-size: 12px; font-weight: 500; white-space: nowrap; font-family: var(--font-data); color: var(--muted); }
.pcol.n .val { color: var(--ink); font-weight: 700; }
.pgrp:hover .bar, .pgrp:focus-visible .bar { filter: brightness(.94); }
.hbars { display: grid; gap: 2px; }
.hrow { display: grid; grid-template-columns: minmax(0, 42%) minmax(0, 1fr) 80px; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 6px; }
.hrow:hover, .hrow:focus-visible { background: var(--surface-2); }
.hrow .lb { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.hrow .lb.url { font-family: var(--font-data); font-size: 11px; }
.hrow .lb small { color: var(--muted); }

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isNum = v => typeof v === "number" && isFinite(v);
const get = (o, path) => path.split(".").reduce((a, k) => (a == null ? undefined : a[k]), o);
function fmt(v, kind) {
  if (!isNum(v)) return '<span class="dash">&ndash;</span>';
  if (kind === "pct") return (v < 1 && v > 0 ? v.toFixed(2) : v.toFixed(1)) + "%";
  if (kind === "pos") return v.toFixed(1);
  if (v >= 10000) return (v / 1000).toFixed(1) + "K";
  return Math.round(v).toLocaleString("en-US");
}
const plain = (v, kind) => fmt(v, kind).replace(/<[^>]+>/g, "").replace("&ndash;", "–");
const niceDate = d => { if (!d) return ""; const x = new Date(d + (d.length === 10 ? "T12:00:00" : "")); return isNaN(x) ? d : x.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); };
function delta(cur, prev, { lowerBetter = false, kind = "int" } = {}) {
  if (!isNum(cur) || !isNum(prev)) return "";
  const d = cur - prev;
  if (Math.abs(d) < 0.05) return '<span class="delta flat">no change</span>';
  const good = lowerBetter ? d < 0 : d > 0;
  const txt = kind === "pct" ? Math.abs(d).toFixed(1) + " pts" : kind === "pos" ? Math.abs(d).toFixed(1) : prev ? Math.abs(d / prev * 100).toFixed(0) + "%" : Math.abs(d);
  return `<span class="delta ${good ? "up" : "down"}">${good ? "&#9650;" : "&#9660;"} ${txt}</span>`;
}

/* ---------- charts ---------- */
function vbars(rows, { kind = "int", note } = {}) {
  const max = Math.max(1, ...rows.map(r => isNum(r.value) ? r.value : 0));
  const cols = rows.map(r => {
    const has = isNum(r.value);
    const h = has ? r.value / max * 100 : 0;
    const tip = `${r.label}: ${has ? plain(r.value, kind) : "not tracked"}${r.tip ? " · " + r.tip : ""}`;
    return `<div class="vcol" tabindex="0" data-tip="${esc(tip)}"><span class="val num" style="bottom:calc(${h}% + 4px)">${has ? fmt(r.value, kind) : '<span class="dash">n/a</span>'}</span>${has ? `<div class="bar" style="height:${h}%"></div>` : ""}</div>`;
  }).join("");
  return `<div class="vbars" role="img" aria-label="${esc(rows.map(r => r.label + " " + plain(r.value, kind)).join(", "))}">
      <div class="grid-l" style="top:32px"></div><div class="grid-l" style="top:calc(16px + 50%)"></div>${cols}</div>
    <div class="vlabels">${rows.map(r => `<span>${r.icon ? ico(r.icon, 18) + "<br>" : ""}${esc(r.label)}</span>`).join("")}</div>${note ? `<p class="note" style="margin-top:8px">${note}</p>` : ""}`;
}
function pbars(rows, { kind = "int" } = {}) {
  const max = Math.max(1, ...rows.flatMap(r => [isNum(r.base) ? r.base : 0, isNum(r.now) ? r.now : 0]));
  const col = (v, cls) => { const h = isNum(v) ? v / max * 100 : 0; return `<div class="pcol ${cls}"><span class="val num" style="bottom:calc(${h}% + 4px)">${isNum(v) ? fmt(v, kind) : '<span class="dash">n/a</span>'}</span>${isNum(v) ? `<div class="bar" style="height:${h}%"></div>` : ""}</div>`; };
  const grps = rows.map(r => `<div class="pgrp" tabindex="0" data-tip="${esc(`${r.label}: ${BWORD} ${plain(r.base, kind)}, now ${plain(r.now, kind)}`)}">${col(r.base, "b")}${col(r.now, "n")}</div>`).join("");
  return `<div class="pbars" role="img" aria-label="${esc(rows.map(r => `${r.label} ${BWORD} ${plain(r.base, kind)} now ${plain(r.now, kind)}`).join(", "))}"><div class="grid-l" style="top:34px"></div><div class="grid-l" style="top:calc(17px + 50%)"></div>${grps}</div>
    <div class="vlabels">${rows.map(r => `<span>${r.icon ? ico(r.icon, 18) + "<br>" : ""}${esc(r.label)}</span>`).join("")}</div>`;
}
function hbars(rows, { kind = "int", url = false, max } = {}) {
  if (!rows.length) return '<p class="note">No data in this snapshot.</p>';
  const m = max || Math.max(1, ...rows.map(r => r.value || 0));
  return `<div class="hbars">${rows.map(r => {
    const tip = `${r.label}: ${plain(r.value, kind)}${r.tip ? " · " + r.tip : ""}`;
    const bar = r.value ? `<span class="${r.muted ? "other" : ""}" style="width:${r.value / m * 100}%"></span>` : "";
    return `<div class="hrow ${r.you ? "you" : ""}" tabindex="0" data-tip="${esc(tip)}"><span class="lb ${url ? "url" : ""}" title="${esc(r.label)}">${esc(r.label)}${r.sub ? ` <small>${esc(r.sub)}</small>` : ""}</span><div class="track">${bar}</div><span class="v num">${r.value ? fmt(r.value, kind) : (r.zeroLabel || '<span class="dash">0</span>')}</span></div>`;
  }).join("")}</div>`;
}
function diverging(rows) {
  if (!rows.length) return '<p class="note">No keyword moved between the two periods.</p>';
  const m = Math.max(1, ...rows.map(r => Math.abs(r.d)));
  return `<div class="dhead"><span></span><span class="l">Dropped</span><span>Improved</span><span></span></div>
    ${rows.map(r => {
      const w = Math.abs(r.d) / m * 100;
      const tip = `${r.kw}: position ${r.prev} to ${r.pos} (${r.d > 0 ? "up " : "down "}${Math.abs(r.d)})`;
      return `<div class="drow" tabindex="0" data-tip="${esc(tip)}"><span class="lb" title="${esc(r.kw)}">${esc(r.kw)}</span><div class="dl">${r.d < 0 ? `<span style="width:${w}%"></span>` : ""}</div><div class="dr">${r.d > 0 ? `<span style="width:${w}%"></span>` : ""}</div><span class="v num">${r.prev} &rarr; ${r.pos}</span></div>`;
    }).join("")}
    <div class="legend"><span><i style="background:var(--up)"></i>Moved up</span><span><i style="background:var(--down)"></i>Moved down</span></div>`;
}
const card = (title, hint, body, cls = "") => `<section class="card ${cls}"><div class="card-h"><h2>${title}</h2>${hint ? `<span class="hint">${hint}</span>` : ""}</div><div class="card-b">${body}</div></section>`;
function kpi(label, cur, prev, path, o = {}) {
  const c = get(cur, path), p = prev ? get(prev, path) : undefined;

function baselineTable(latest) {
  const rows = [["Impressions", "seo.gsc.impressions"], ["Click-through rate", "seo.gsc.ctr", { kind: "pct" }], ["Top 3 keywords", "seo.gsc.top3"], ["Page one (1 to 10)", "seo.gsc.page1"], ["Page two (11 to 20)", "seo.gsc.page2count"], ["All ranking keywords", "seo.gsc.keywords"]];
  const have = latest.filter(x => x.cur && x.prev);

    const ch = p => { const c = get(x.cur, p), v = get(x.prev, p); return isNum(c) && isNum(v) && v ? (c - v) / v : 0; };
    const w = v => v > 0.05 ? "up" : v < -0.05 ? "down" : "flat";
    return `Clicks ${w(ch("seo.gsc.clicks"))}, impressions ${w(ch("seo.gsc.impressions"))}, page-one keywords ${w(ch("seo.gsc.page1"))}.`;

    <div class="hero-n"><span class="l">Clicks from Google, last 28 days</span><div class="v"><b class="num">${fmt(c)}</b>${delta(c, v)}<span>from ${fmt(v)} at baseline</span></div></div>

function seoTab(cur, prev) {

  }).join("");
  const pageRows = (s.pages || []).map(p => {

    return `<tr><td><span class="mono">${esc(p.url)}</span></td><td class="n">${bi == null ? '<span class="dash">&lt;40</span>' : fmt(bi)}</td><td class="n now">${fmt(p.impr)}</td><td class="n">${bi == null ? '<span class="dash">&ndash;</span>' : delta(p.impr, bi) || '<span class="delta flat">no change</span>'}</td><td class="n">${b ? fmt(b.clicks || 0) : '<span class="dash">&ndash;</span>'} &rarr; <b>${fmt(p.clicks || 0)}</b></td><td class="n">${b && isNum(b.pos) ? b.pos : "–"} &rarr; <b>${fmt(p.pos, "pos")}</b></td></tr>`;

function p2targets(cur) {

  rows.sort((a, b) => b.impr - a.impr);
  return { rows, count: rows.length, impr: rows.reduce((a, r) => a + r.impr, 0), fresh: rows.filter(r => r.new).length, top: rows[0] };
}
const moveTxt = r => r.new ? "newly ranking" : r.d > 0 ? `up ${r.d} spots` : r.d < 0 ? `down ${-r.d} spots` : "steady";
const moveCell = r => r.new ? '<span class="tag new">New</span>' : r.d > 0 ? `<span class="delta up">&#9650; ${r.d}</span>` : r.d < 0 ? `<span class="delta down">&#9660; ${-r.d}</span>` : '<span class="delta flat">steady</span>';

function verdictOf(c) {
  const m = c.measured;
  if (!m) return { cls: "wait", label: "Waiting for data" };
  const b = m.beforeImpr / m.beforeWeeks, a = m.afterImpr / m.afterWeeks;
  if (b < 5 && a < 5) return { cls: "low", label: "Too few searches" };
  const ch = b ? (a - b) / b : 1;
  if (ch > 0.15) return { cls: "up", label: "Up" };
  if (ch < -0.15) return { cls: "down", label: "Down" };
  return { cls: "flat", label: "No real change" };
}
function updatesTab(site) {
  const list = (state.changes[site.key] || []).slice().sort((a, b) => String(a.changedOn).localeCompare(String(b.changedOn)) || String(a.label).localeCompare(String(b.label)));
  if (!list.length) return `<div class="card empty"><h2>No tracked updates for ${esc(site.short)}</h2><p>When a page is updated, Claude records a baseline and measures the result 2 to 4 weeks later.</p></div>`;
  const measured = list.filter(c => c.measured), waiting = list.filter(c => !c.measured);
  const wk = (n, w) => (isNum(n) && w ? n / w : null);
  const counts = measured.reduce((a, c) => { const v = verdictOf(c).cls; a[v] = (a[v] || 0) + 1; return a; }, {});
  const kpiRaw = (label, v, sub) => `<div class="card kpi"><span class="k">${esc(label)}</span><span class="v num">${v}</span><span class="s">${sub || ""}</span></div>`;
  const maxW = Math.max(1, ...measured.flatMap(c => [wk(c.measured.beforeImpr, c.measured.beforeWeeks), wk(c.measured.afterImpr, c.measured.afterWeeks)]));
  const pairChart = measured.length ? `<div class="pairs">${measured.map(c => {
      const m = c.measured, b = wk(m.beforeImpr, m.beforeWeeks), a = wk(m.afterImpr, m.afterWeeks);
      return `<div class="pair" tabindex="0" data-tip="${esc(`${c.label}: ${b.toFixed(1)} impressions/week before, ${a.toFixed(1)} after · position ${m.beforePos ?? "–"} to ${m.afterPos ?? "–"}`)}">
        <span class="lb">${esc(c.label)}</span>
        <div class="pt"><span class="before" style="width:${b / maxW * 100}%"></span></div><span class="pv num">${b.toFixed(0)}</span>
        <div class="pt"><span class="after" style="width:${a / maxW * 100}%"></span></div><span class="pv num">${a.toFixed(0)}</span></div>`;
    }).join("")}</div><div class="legend"><span><i style="background:var(--other)"></i>Before (per week)</span><span><i style="background:var(--series)"></i>After (per week)</span></div>` : '<p class="note">Nothing measured yet.</p>';
  const row = c => {
    const m = c.measured, v = verdictOf(c);
    const b = m ? wk(m.beforeImpr, m.beforeWeeks) : null, a = m ? wk(m.afterImpr, m.afterWeeks) : null;
    const pct = m && b ? Math.round((a - b) / b * 100) : null;
    const pos = m && isNum(m.beforePos) && isNum(m.afterPos) && m.afterPos ? `${m.beforePos} &rarr; ${m.afterPos}` : m && isNum(m.beforePos) ? `${m.beforePos} &rarr; –` : '<span class="dash">&ndash;</span>';
    return `<tr><td><span class="kw">${esc(c.label)}</span><span class="u">${esc(c.page)}${c.kind ? " · " + esc(c.kind) : ""}</span>${c.what ? `<span class="what">${esc(c.what)}</span>` : ""}</td>
      <td class="n">${esc(niceDate(c.changedOn))}${c.confirmed ? '<br><span class="tag new">Confirmed</span>' : ""}</td>
      <td class="n">${m ? b.toFixed(1) : '<span class="dash">&ndash;</span>'}</td><td class="n">${m ? a.toFixed(1) : '<span class="dash">&ndash;</span>'}</td>
      <td class="n">${pct == null ? '<span class="dash">&ndash;</span>' : `<span class="delta ${pct > 15 ? "up" : pct < -15 ? "down" : "flat"}">${pct > 0 ? "+" : ""}${pct}%</span>`}</td>
      <td class="n">${pos}</td>
      <td><span class="vd ${v.cls}">${v.label}</span>${!m && c.nextCheck ? `<span class="u">check ${esc(niceDate(c.nextCheck))}</span>` : ""}${c.note ? `<span class="u">${esc(c.note)}</span>` : ""}</td></tr>`;
  };
  const table = rows => `<div class="tbl"><table><thead><tr><th>Page</th><th class="n">Updated</th><th class="n">Before /wk</th><th class="n">After /wk</th><th class="n">Change</th><th class="n">Position</th><th>Result</th></tr></thead><tbody>${rows.map(row).join("")}</tbody></table></div>`;
  const win = measured[0] && measured[0].measured;
  return `<div class="grid g4">
      ${kpiRaw("Pages updated", list.length, "tracked since September")}
      ${kpiRaw("Measured so far", measured.length, `${counts.up || 0} up, ${counts.down || 0} down, ${counts.flat || 0} flat`)}
      ${kpiRaw("Waiting for data", waiting.length, "Google data takes 2 to 4 weeks")}
      ${kpiRaw("Clicks gained", measured.reduce((t, c) => t + ((c.measured.afterClicks || 0) - (c.measured.beforeClicks || 0)), 0), "after vs before")}
    </div>
    <p class="note">${ico(PLAT.gsc, 13)}Each page is measured on its own: average impressions per week in Google before its update vs after it, not a running total${win ? ` (before: ${esc(niceDate(win.beforeFrom))} to ${esc(niceDate(win.beforeTo))}; after: ${esc(niceDate(win.afterFrom))} to ${esc(niceDate(win.afterTo))})` : ""}. "Updated" is the date WordPress last saved the page.</p>
    ${card("Before vs after", "impressions per week; hover for position", pairChart)}
    ${card("Measured", `${measured.length} pages`, table(measured))}
    ${card("Waiting for data", `${waiting.length} items`, table(waiting))}`;
}

    sa("gsc_get_site_property_performance", { selected_property: prop, country_code: cc, period_start: win.from, period_end: win.to, limit: 1 }),
    count({}),
    count({ position_from: 10.5, position_to: 20.49, impressions_from: 5 }),
    count({ ...cmp, keyword_position_type: "improved" }),

async function liveRefresh() {

    const bd = dayCount(c.bFrom, c.bTo);

    prevWin = { from: c.bFrom, to: c.bTo, pFrom: shiftDay(c.bFrom, -bd), pTo: shiftDay(c.bFrom, -1) };
    refWord = "in the baseline"; label = "your range";
  } else {

          seo: { ...pseo, ...keep }, ...carry, errors: [],
          notes: [mode === "custom" ? `Baseline for the ${rangeTxt(nowWin.from, nowWin.to)} range.` : `The ${mode} days before ${niceDate(nowWin.from)}, pulled to compare with the latest ${mode} days.`],
        })));

        site: site.key, date: nowWin.to, takenAt: new Date().toISOString(), live: true, ...tag, cmpId: prevWin ? prevId : undefined,
        source: `Live refresh from the tracker page: Search Atlas GSC connector, US only, ${mode === "custom" ? "custom range" : `${mode}-day window`}`,

  const latest = bl[bl.length - 1];
  const step = (n, title, ok, body) => `<section class="step ${ok ? "ok" : ""}"><h3><span class="sn">${ok ? "&#10003;" : n}</span>${title}</h3>${body}</section>`;
  const baseRows = bl.slice().reverse().map(b => `<tr><td>${esc(rangeTxt(b.from, b.to))}<span class="u">saved ${esc(niceDate((b.takenAt || "").slice(0, 10)))}${b === bl[0] ? " · first baseline" : ""}</span></td><td class="n">${fmt(b.impr)}</td><td class="n">${fmt(b.clicks)}</td><td class="n">${fmt(b.ctr, "pct")}</td><td class="n">${isNum(b.pos) ? b.pos : "–"}</td><td class="n">${(b.queries || []).length}</td></tr>`).join("");
  const qRows = latest ? (latest.queries || []).slice(0, 25).map(q => `<tr><td>${esc(q.q)}</td><td class="n">${fmt(q.impr)}</td><td class="n">${fmt(q.clicks)}</td><td class="n">${isNum(q.pos) ? q.pos : "–"}</td></tr>`).join("") : "";
  const logged = (state.changes[site.key] || []).filter(c => normPath(c.page) === path).sort((a, b) => String(b.changedOn).localeCompare(String(a.changedOn)));
  const top10 = latest ? (latest.queries || []).filter(q => isNum(q.pos) && q.pos <= 10).map(q => `Query "${q.q}" at position ${q.pos}`) : [];
  return `<div class="drawer" role="dialog" aria-modal="true" aria-label="Page workflow for ${esc(path)}">
    <div class="dhd"><div><span class="eyebrow">Page workflow</span><h2 class="mono">${esc(path)}</h2><span class="u">${esc([row.info.service, row.info.city].filter(Boolean).join(" · "))}${row.d ? ` · suggested ${esc(row.d)}` : ""}</span></div><button type="button" class="open" id="auClose">Close</button></div>
    <p class="rule">Baseline &rarr; Audit &rarr; Protect &rarr; Update &rarr; Change log. Never overwrite old baseline data.</p>
    ${row.why ? `<p class="note">${esc(row.why)}</p>` : ""}
    ${step(1, "Baseline before update", g.baseline, `<p class="note">Pulls this page's clicks, impressions, CTR, position and every query with its position for the last 28 days, and saves it as a new record. Old baselines are kept.</p>
      ${MCP && DB ? `<button type="button" class="refbtn sm" id="auBaseBtn" ${busy ? "disabled" : ""}>${busy ? "Saving…" : "Save baseline now"}</button>` : '<p class="note">Open the tracker on claude.ai to save a baseline.</p>'}${state.auBase.msg ? `<p class="note ${state.auBase.err ? "bad" : ""}">${esc(state.auBase.msg)}</p>` : ""}
      ${bl.length ? `<div class="tbl"><table><thead><tr><th>Window</th><th class="n">Impr.</th><th class="n">Clicks</th><th class="n">CTR</th><th class="n">Pos</th><th class="n">Queries</th></tr></thead><tbody>${baseRows}</tbody></table></div>
      <details><summary>Top queries in the latest baseline (${(latest.queries || []).length})</summary><div class="tbl"><table><thead><tr><th>Query</th><th class="n">Impr.</th><th class="n">Clicks</th><th class="n">Pos</th></tr></thead><tbody>${qRows}</tbody></table></div></details>` : ""}`)}
    ${step(2, "Audit checklist", g.audit, `<div class="checks">${CHECKS.map(([k, l]) => `<label class="chk"><input type="checkbox" class="auChk" data-k="${k}" ${checks[k] ? "checked" : ""} ${dis}> ${esc(l)}</label>`).join("")}</div>
      <textarea class="auField" data-f="auditNotes" rows="3" placeholder="What you found (indexing, intent, title/H1, links, schema...)" ${dis}>${esc(w.auditNotes || "")}</textarea>`)}
    ${step(3, "Protect list", g.protect, `<p class="note">Rankings, queries, sections, links and elements that already work. These stay untouched in the update.</p>
      <textarea class="auField" data-f="protect" rows="4" placeholder="One item per line" ${dis}>${esc(w.protect || "")}</textarea>
      ${top10.length ? `<button type="button" class="open" id="auProtectFill" ${dis}>Add the ${top10.length} page-one quer${top10.length === 1 ? "y" : "ies"} from the baseline</button>` : ""}`)}
    ${step(4, "Classify and give the evidence", g.classify && g.evidence, `<label class="blk">Classification <select class="auField" data-f="decision" ${dis}><option value="">Choose…</option>${CLASSES.map(c => `<option ${w.decision === c ? "selected" : ""}>${c}</option>`).join("")}</select></label>
      <textarea class="auField" data-f="evidence" rows="3" placeholder="Evidence: the numbers and findings that support this call" ${dis}>${esc(w.evidence || "")}</textarea>
      <input type="text" class="auField" data-f="note" value="${esc(w.note || "")}" placeholder="Short note for the table" ${dis}>
      ${g.noChange ? '<p class="verdict" style="margin:8px 0 0"><b>NO CHANGE RECOMMENDED.</b> Leave the page as it is.</p>' : ""}`)}
    ${step(5, "Update and change log", logged.length > 0, `${g.ready ? `<p class="note">All checks passed. After the approved update goes live, log it here. It also appears in the Updates tab, which measures it 2 to 4 weeks later against the baseline.</p>
      <div class="cdr2"><label>Date changed <input type="date" id="auChDate" value="${todayYmd()}" ${dis}></label><label>Type <select id="auChKind" ${dis}><option>${row.info.type === "blog" ? "blog post" : row.info.type === "location" ? "city page" : "service page"}</option><option>title and meta</option><option>internal links</option><option>schema</option><option>technical fix</option></select></label></div>
      <textarea id="auChWhat" rows="3" placeholder="Exactly what changed" ${dis}></textarea><button type="button" class="refbtn sm" id="auChSave" ${dis}>Add to change log</button>`
      : `<p class="note">Locked until ${g.noChange ? "the classification calls for a change" : [!g.baseline && "a baseline is saved", !g.audit && "all 8 audit checks are ticked", !g.protect && "the protect list is filled", !g.classify && "the page is classified", !g.evidence && "the evidence is written"].filter(Boolean).join(", ")}.</p>`}
      ${state.auChMsg ? `<p class="note ${state.auChErr ? "bad" : ""}">${esc(state.auChMsg)}</p>` : ""}
      ${logged.length ? `<ul class="clog">${logged.map(c => `<li><b>${esc(niceDate(c.changedOn))}</b> ${esc(c.kind || "")}: ${esc(c.what || c.note || c.label || "")}</li>`).join("")}</ul>` : ""}`)}
  </div>`;
}
function renderDrawer(force) {
  const el = document.getElementById("auDrawer");
  if (!el) return;
  if (!state.auOpen || state.tab !== "audit") { el.hidden = true; el.innerHTML = ""; document.body.classList.remove("drawer-open"); return; }
  if (!force && el.contains(document.activeElement) && /TEXTAREA|INPUT/.test(document.activeElement.tagName)) return;
  const st = el.querySelector(".drawer") ? el.querySelector(".drawer").scrollTop : 0;
  el.hidden = false; el.innerHTML = drawerHtml(); document.body.classList.add("drawer-open");
  const d = el.querySelector(".drawer"); if (d) d.scrollTop = st;
}
async function saveWork(patch) {
  const id = pageKey(state.view, state.auOpen);
  const next = { ...(state.pageWork[id] || {}), ...patch, site: state.view, path: state.auOpen, at: new Date().toISOString() };
  state.pageWork[id] = next;
  try { await DB.doc(`pageWork/${id}`).set(JSON.parse(JSON.stringify(next))); state.auChMsg = ""; }
  catch (err) { state.auChMsg = "Couldn't save: only editors of this tracker can change the workflow."; state.auChErr = true; }
}
async function saveBaseline() {
  const key = state.view, path = state.auOpen;
  if (!MCP || !DB || state.auBase.busy) return;
  const win = liveWindow(28), id = `${pageKey(key, path)}__${win.to}`;
  if (baselinesOf(key, path).some(b => b._id === id)) { state.auBase = { busy: false, msg: `A baseline for ${rangeTxt(win.from, win.to)} is already saved. It is kept as is; a new one can be saved once Google adds newer data.` }; renderDrawer(true); return; }
  state.auBase = { busy: true, msg: "" }; renderDrawer(true);
  try {
    const url = GSC_PROP[key].replace(/\/$/, "") + path;
    const per = { property: GSC_PROP[key], page_url: url, country_code: "US", period1_start: win.pFrom, period1_end: win.pTo, period2_start: win.from, period2_end: win.to };
    const sumP = await sa("gsc_get_page_summary", per);
    let qs = [], pg = 1, more = true;
    while (more && pg <= 4) { const kp = await sa("gsc_get_page_keywords", { ...per, page_size: 50, page: pg }); qs = qs.concat(rowsOf(kp)); more = kp.has_more; pg++; }
    const seenQ = new Set();
    const queries = qs.filter(r => r.keyword && !seenQ.has(r.keyword) && seenQ.add(r.keyword)).map(r => ({ q: r.keyword, clicks: r.clicks || 0, impr: r.impressions || 0, pos: isNum(r.position) ? Math.round(r.position) : null }))
      .sort((a, b) => b.impr - a.impr);
    const s = (sumP && sumP.result) || {}, impr = s.impressions || 0, clicks = s.traffic || 0;
    const ex = await DB.doc(`pageBaselines/${id}`).get().catch(() => null);
    if (ex && ex.exists) { state.auBase = { busy: false, msg: "That baseline already exists and was left untouched." }; renderDrawer(true); return; }
    const L = state.leads[key], leads = ((L && L.rows) || []).filter(r => r.page && normPath(r.page) === path && r.d >= win.from && r.d <= win.to).length;
    await DB.doc(`pageBaselines/${id}`).set(JSON.parse(JSON.stringify({ site: key, path, from: win.from, to: win.to, takenAt: new Date().toISOString(), clicks, impr, ctr: impr ? Math.round(clicks / impr * 10000) / 100 : 0, pos: isNum(s.position) ? s.position : null, keywords: s.keywords ?? queries.length, leads, queries, source: "Search Atlas GSC connector, US only (gsc_get_page_summary + gsc_get_page_keywords)" })));
    state.auBase = { busy: false, msg: `Baseline saved for ${rangeTxt(win.from, win.to)}: ${plain(impr)} impressions, ${plain(clicks)} clicks, ${queries.length} queries.` };
  } catch (err) {
    state.auBase = { busy: false, msg: refreshErr(err), err: true };
  }
  renderDrawer(true);
}
async function logChange() {
  const key = state.view, path = state.auOpen, g = gateOf(key, path);
  if (!g.ready || !DB) return;
  const date = document.getElementById("auChDate").value, what = document.getElementById("auChWhat").value.trim(), kind = document.getElementById("auChKind").value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !what) { state.auChMsg = "Add the date and exactly what changed."; state.auChErr = true; renderDrawer(true); return; }
  const w = workOf(key, path), bl = baselinesOf(key, path), b = bl[bl.length - 1];
  const slug = path.replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "") || "home";
  let id = `${key}_${slug}_${date}`, n = 2;
  while ((state.changes[key] || []).some(c => c._id === id)) id = `${key}_${slug}_${date}-${n++}`;
  const doc = { site: key, page: path, label: path, changedOn: date, kind, what, confirmed: true, measured: null, nextCheck: shiftDay(date, 28), classification: w.decision, baselineId: b ? b._id : null,
    note: b ? `Baseline ${rangeTxt(b.from, b.to)}: ${b.impr} impr, ${b.clicks} clicks, position ${b.pos ?? "–"}. Protect: ${(w.protect || "").split("\n").filter(Boolean).slice(0, 4).join("; ")}` : "", evidence: w.evidence || "", loggedAt: new Date().toISOString() };
  try { await DB.doc(`changes/${id}`).set(JSON.parse(JSON.stringify(doc))); state.auChMsg = "Logged. It will show in the Updates tab."; state.auChErr = false; }
  catch (err) { state.auChMsg = "Couldn't save: only editors of this tracker can log changes."; state.auChErr = true; }
  renderDrawer(true);
}

/* ---------- audit runs ---------- */
async function fetchPagesSlice(prop, win, a, b, depth) {
  const base = { property: prop, country_code: "US", period2_start: win.from, period2_end: win.to, period1_start: win.pFrom, period1_end: win.pTo, page_size: 50, position_from: a, position_to: b };
  const first = await sa("gsc_get_pages", { ...base, page: 1 });
  const total = isNum(first.total_count) ? first.total_count : 0;
  if (total > 50 && depth < 7 && b - a >= 1) {
    const mid = Math.floor((a + b) / 2);
    const left = await fetchPagesSlice(prop, win, a, mid + 0.49, depth + 1);
    const right = await fetchPagesSlice(prop, win, mid + 0.5, b, depth + 1);
    return { total, rows: [...left.rows, ...right.rows] };
  }
  let rows = rowsOf(first), more = first.has_more;
  for (let p = 2; more && p <= 8; p++) { const nx = await sa("gsc_get_pages", { ...base, page: p }); rows = rows.concat(rowsOf(nx)); more = nx.has_more; }
  return { total, rows };
}
async function runAudit(key) {
  const site = SITES.find(s => s.key === key);
  if (!site || !MCP || !DB || (state.auRun[key] || {}).busy) return;
  state.auTried[key] = true;
  const win = liveWindow(28), id = `${key}_${win.to}`;
  if (runsOf(key).some(r => r._id === id)) { state.auRun[key] = { busy: false, msg: `A run for ${rangeTxt(win.from, win.to)} is already saved and stays as it is. Search Console adds a new day of data daily, so the next run can be saved tomorrow.` }; render(); return; }
  state.auRun[key] = { busy: true, msg: `Pulling every ${site.short} page from Search Console…` }; render();
  try {
    const { total, rows } = await fetchPagesSlice(GSC_PROP[key], win, 0, 200, 0);
    const seen = new Map(), raw = new Set();
    rows.forEach(r => {
      if (!r.page || raw.has(r.page)) return;
      raw.add(r.page);
      const k = normPath(r.page);
      if (seen.has(k)) { const o = seen.get(k); o.impr += r.impressions || 0; o.clicks += r.clicks || 0; return; }
      const pos = isNum(r.position) && r.position > 0 ? Math.round(r.position) : null;
      const prevRaw = pos != null && isNum(r.position_delta) ? Math.round(r.position + r.position_delta) : pos == null && isNum(r.position_delta) ? Math.round(r.position_delta) : null;
      seen.set(k, { url: k, clicks: r.clicks || 0, impr: r.impressions || 0, pos, prev: prevRaw && prevRaw > 0 ? prevRaw : null, kws: r.keywords_count || 0, topKw: r.top_keyword || "" });
    });
    const out = [...seen.values()];
    const ex = await DB.doc(`auditRuns/${id}`).get().catch(() => null);
    if (ex && ex.exists) { state.auRun[key] = { busy: false, msg: "That run already exists and was left untouched." }; render(); return; }
    await DB.doc(`auditRuns/${id}`).set(JSON.parse(JSON.stringify({ site: key, days: 28, from: win.from, to: win.to, pFrom: win.pFrom, pTo: win.pTo, takenAt: new Date().toISOString(), total, pulled: out.length, baseline: !runsOf(key).length || undefined, source: "Search Atlas GSC connector (gsc_get_pages), US only", rows: out })));
    state.au.run[key] = id;
    state.auRun[key] = { busy: false, msg: `Saved run ${rangeTxt(win.from, win.to)}: ${out.length} pages.${runsOf(key).length ? " Earlier runs are kept." : " This is the baseline."}` };
  } catch (err) {
    state.auRun[key] = { busy: false, msg: `${refreshErr(err)} Nothing was saved. Click the button to try again.`, err: true };
  }
  render();
}

/* ---------- data ---------- */
(async () => {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (err) { db = null; }
  if (!db) { state.dbState = "unavailable"; render(); return; }
  DB = db;
  window.claude.use("mcp").then(m => { MCP = m; if (state.tab === "audit" && state.dbState === "ready") render(); else renderNav(); }, () => {});
  let gotSnaps = false, gotWork = false;
  const ready = () => { if (gotSnaps && gotWork) { state.dbState = "ready"; render(); } };
  db.collection("snapshots").onSnapshot(snap => {
    const by = {};
    snap.docs.forEach(d => {
      const x = { ...d.data(), _id: d.id };
      if (x.archived) return;
      if (x.geo && Array.isArray(x.geo.competitors)) { const me = x.geo.competitors.find(c => c.you); x.geo = { ...x.geo, ahead: me ? x.geo.competitors.filter(c => !c.you && c.visibility > me.visibility).length : undefined }; }
      (by[x.site] = by[x.site] || []).push(x);
    });
    Object.values(by).forEach(a => a.sort((p, q) => String(p.date).localeCompare(String(q.date))));
    state.snaps = by; gotSnaps = true; ready();
  }, () => { state.dbState = "unavailable"; render(); });
  db.collection("changes").onSnapshot(snap => {
    const by = {};
    snap.docs.forEach(d => { const x = { ...d.data(), _id: d.id }; (by[x.site] = by[x.site] || []).push(x); });
    state.changes = by; if (state.dbState === "ready") { render(); renderDrawer(false); }
  }, () => {});
  db.collection("auditRuns").onSnapshot(snap => {
    const by = {}; snap.docs.forEach(d => { const x = { ...d.data(), _id: d.id }; (by[x.site] = by[x.site] || []).push(x); });
    Object.values(by).forEach(a => a.sort((p, q) => String(p.to).localeCompare(String(q.to)) || String(p.takenAt).localeCompare(String(q.takenAt))));
    state.auditRuns = by; if (state.dbState === "ready") render();
  }, () => {});
  db.collection("pageBaselines").onSnapshot(snap => {
    const by = {}; snap.docs.forEach(d => { const x = { ...d.data(), _id: d.id }; const k = pageKey(x.site, x.path); (by[k] = by[k] || []).push(x); });
    Object.values(by).forEach(a => a.sort((p, q) => String(p.to).localeCompare(String(q.to))));
    state.baselines = by; if (state.dbState === "ready") { render(); renderDrawer(false); }
  }, () => {});
  db.collection("pageWork").onSnapshot(snap => {
    const by = {}; snap.docs.forEach(d => { by[d.id] = d.data(); });
    state.pageWork = by;
    if (state.dbState === "ready" && state.tab === "audit" && !(document.activeElement && document.activeElement.id === "auQ")) { render(); renderDrawer(false); }
  }, () => {});
  db.collection("leads").onSnapshot(snap => {
    const by = {}; snap.docs.forEach(d => { by[d.id] = d.data(); });
    state.leads = by; if (state.dbState === "ready") render();
  }, () => {});
  db.collection("worklog").onSnapshot(snap => {
    const by = {}; snap.docs.forEach(d => { by[d.id] = d.data(); });
    state.work = by; gotWork = true; ready();
  }, () => { gotWork = true; ready(); });
})();
render();
</script>

</body></html>
