      return true;
    });
    if (ui.sort){
      var k = ui.sort;
      out = out.slice().sort(function(a,b){
        var x = val(a,k), y = val(b,k);
        var ex = (x==null||x===''), ey = (y==null||y==='');
        if (ex && ey) return tie(a,b); if (ex) return 1; if (ey) return -1;
        var c = (typeof x==='number' && typeof y==='number') ? (x-y) : String(x).localeCompare(String(y));
        return c ? c*ui.dir : tie(a,b);
      });
    }
    return out;
  }

  function summary(){
    var inG = DATA.filter(function(r){return val(r,'google')==='Yes';}).length;
    var notG = DATA.filter(function(r){var g=val(r,'google');return g==='Not yet'||g==='Skipped'||g==='Requested'||g==='New';}).length;
    var clicks = DATA.reduce(function(a,r){return a+(Number(val(r,'clicks'))||0);},0);
    var shown = DATA.reduce(function(a,r){return a+(Number(val(r,'shown'))||0);},0);
    var work = DATA.filter(function(r){var s=val(r,'status');return s==='Needs work'||s==='In progress';}).length;
    function card(n,l){ return '<div class="sum"><b>'+n+'</b><span>'+l+'</span></div>'; }
    return '<div class="summary">'+card(DATA.length,'pages on the site')+card(inG,'in Google')+card(notG,'not in Google yet')+
      card(clicks.toLocaleString(),'Google clicks (Aug 14 - Sep 8)')+card(shown.toLocaleString(),'times shown in Google')+card(work,'needs work or in progress')+'</div>';
  }

  var CHOICES = {
    google: ['Yes','Not yet','Skipped','Requested','Hidden','New'],
    type: ['Core','Service','Service guide','Ad page','Local','Blog'],
    protected: ['', 'Ask first']
  };
  function kindOf(k){
    k = fk(k);
    if (k==='status') return 'status';
    if (CHOICES[k]) return 'choice';
    if (k==='published' || k==='updated') return 'date';
    if (k==='clicks' || k==='shown' || k==='words' || k==='faq') return 'num';
    return 'text';
  }

  function cell(r,c,ci){
    var k = c.k, v = val(r,k), ref = LETTERS[ci], kind = kindOf(k);
    var ed = isEdited(r,k), isSel = selected && String(selected.id)===String(r.id) && selected.k===k;
    var isEd = editing && String(editing.id)===String(r.id) && editing.k===k;

    var base = ' data-ref="'+ref+'" data-id="'+r.id+'" data-k="'+k+'"'+(classes?' class="'+classes+'"':'')+tip;
    if (isEd) return '<td'+base+'>'+editor(r,k,v)+'</td>';

    if (k==='path') return '<td'+base+'><a href="https://pipelinersusa.com'+esc(v)+'" target="_blank" rel="noopener">'+esc(v)+'</a></td>';
    if (k==='indexed' || k==='google') return '<td'+base+'>'+(v?'<span class="chip ch-'+cls(v)+'">'+esc(GOOGLE_LABEL[v]||v)+'</span>':'')+'</td>';
    if (kind==='date') return '<td'+base+'>'+fmtDate(v)+'</td>';
    if (k==='protected') return '<td'+base+'>'+(v?'<span class="chip ch-lock">Ask first</span>':'')+'</td>';
    if (k==='status'){

      return '<td'+base+'><select class="stsel '+(v?'s-'+cls(v):'s-none')+'" data-id="'+r.id+'" aria-label="Status for '+esc(val(r,'name'))+'"'+(readOnly?' disabled':'')+'>'+opts+'</select></td>';

  function editor(r,k,v){
    var kind = kindOf(k);

      var list = CHOICES[fk(k)], cur = (k==='protected') ? (v?'Ask first':'') : (v||'');

    }

    return '<input class="celled" type="'+(kind==='num'?'number':'text')+'" data-id="'+r.id+'" data-k="'+k+'" value="'+esc(v==null?'':v)+'">';
  }

  function grid(){
    var rows = rowsFor(ui.tab);
    var C = colsFor(ui.tab);

    var cols = '<colgroup><col style="width:46px">'+C.map(function(c){ return '<col data-k="'+c.k+'" style="width:'+widthOf(c.k)+'px">'; }).join('')+'</colgroup>';
    var total = 46 + C.reduce(function(a,c){ return a+widthOf(c.k); },0);
    var letters = '<tr class="letters"><th class="rn"></th>'+C.map(function(c,i){return '<th'+(c.cls==='pg'?' class="pg"':'')+'>'+LETTERS[i]+handle(c.k)+'</th>';}).join('')+'</tr>';
    var labels = '<tr class="labels"><th class="rn">1</th>'+C.map(function(c){

    var body = rows.map(function(r,i){

    }).join('');

    return '<table class="g" role="grid" style="width:'+total+'px">'+cols+'<thead>'+letters+labels+'</thead><tbody>'+body+'</tbody></table>';
  }

  function tabs(){

  function chipHtml(){

  // ---- editing ----
  function canEdit(k){ return !readOnly && kindOf(k)!=='status'; }
  function startEdit(id,k,firstChar){
    if (!canEdit(k)) return;
    editing = {id:id, k:k}; selected = {id:id, k:k};
    render();
    var ce = document.querySelector('.celled');
    if (ce && firstChar!=null && ce.tagName==='INPUT' && (ce.type==='text' || ce.type==='number')){ ce.value = firstChar; }
  }
  function commitEdit(move){
    if (!editing) return;
    var ce = document.querySelector('.celled');
    var id = editing.id, k = editing.k, r = rowById(id);
    editing = null;
    if (ce && r){
      var raw = ce.value, v;
      var kind = kindOf(k);
      if (kind==='num') v = raw==='' ? null : Number(raw);
      else if (k==='protected') v = raw==='Ask first';
      else v = raw;
      setPending(id, k, v);
    }
    if (move) moveSel(move[0], move[1], true); else render();
  }
  function cancelEdit(){ editing = null; render(); }

  function moveSel(dr, dc, rerender){
    if (!selected){ return; }
    var C = colsFor(ui.tab), rows = rowsFor(ui.tab);
    var ci = C.map(function(c){return c.k;}).indexOf(selected.k);
    var ri = rows.map(function(r){return String(r.id);}).indexOf(String(selected.id));
    if (ci<0 || ri<0) { if (rerender) render(); return; }
    ci = Math.max(0, Math.min(C.length-1, ci+dc)); ri = Math.max(0, Math.min(rows.length-1, ri+dr));
    selected = {id: rows[ri].id, k: C[ci].k};
    if (rerender){ render(); }
    else {
      document.querySelectorAll('td.sel').forEach(function(x){x.classList.remove('sel');});
      var td = document.querySelector('td[data-id="'+selected.id+'"][data-k="'+selected.k+'"]');
      if (td){ td.classList.add('sel'); }
      refreshFbar();
    }
    var td2 = document.querySelector('td[data-id="'+selected.id+'"][data-k="'+selected.k+'"]');
    if (td2 && td2.scrollIntoView) td2.scrollIntoView({block:'nearest', inline:'nearest'});
  }

  function setColWidth(k, w){
    var table = document.querySelector('table.g'); if (!table) return;
    var col = table.querySelector('col[data-k="'+k+'"]'); if (!col) return;
    var old = parseFloat(col.style.width) || widthOf(k);
    col.style.width = w+'px';
    table.style.width = (parseFloat(table.style.width) - old + w)+'px';
  }
  var drag = null;
  document.addEventListener('pointerdown', function(e){
    var h = e.target.closest && e.target.closest('.rs'); if (!h) return;
    e.preventDefault(); e.stopPropagation();
    drag = {k:h.dataset.rs, x:e.clientX, w:widthOf(h.dataset.rs), el:h};
    h.classList.add('active'); document.body.classList.add('resizing');
    try { h.setPointerCapture(e.pointerId); } catch(err){}
  });
  document.addEventListener('pointermove', function(e){
    if (!drag) return;
    var w = Math.max(50, Math.round(drag.w + e.clientX - drag.x));
    colW[drag.k] = w; setColWidth(drag.k, w);
  });
  function endDrag(){
    if (!drag) return;
    drag.el.classList.remove('active'); document.body.classList.remove('resizing');
    drag = null; suppressClick = Date.now() + 250; saveColW();
  }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
  document.addEventListener('dblclick', function(e){
    var h = e.target.closest && e.target.closest('.rs'); if (!h) return;
    var k = h.dataset.rs; delete colW[k]; saveColW(); setColWidth(k, widthOf(k));
  });

  var mv = null;
  document.addEventListener('pointerdown', function(e){
    if (e.button !== 0 || (e.target.closest && e.target.closest('.rs'))) return;
    var th = e.target.closest && e.target.closest('tr.labels th[data-move]'); if (!th) return;
    mv = {k: th.dataset.move, x: e.clientX, y: e.clientY, th: th, on: false, target: null};
  });
  document.addEventListener('pointermove', function(e){
    if (!mv) return;
    if (!mv.on){
      if (Math.abs(e.clientX-mv.x) < 6 && Math.abs(e.clientY-mv.y) < 6) return;
      mv.on = true; document.body.classList.add('moving'); mv.th.classList.add('dragging');
      mv.ghost = document.createElement('div'); mv.ghost.className = 'col-ghost'; mv.ghost.textContent = mv.th.querySelector('.lbl').textContent.replace(/[▲▼]/g,'');
      mv.drop = document.createElement('div'); mv.drop.className = 'col-drop';
      document.body.appendChild(mv.ghost); document.body.appendChild(mv.drop);
    }
    mv.ghost.style.left = (e.clientX+12)+'px'; mv.ghost.style.top = (e.clientY+10)+'px';
    var heads = [].slice.call(document.querySelectorAll('tr.labels th[data-move]'));
    var gw = document.querySelector('.gridwrap').getBoundingClientRect();
    var best = null;
    heads.forEach(function(h, i){
      var r = h.getBoundingClientRect();
      if (e.clientX < r.left + r.width/2 && best===null) best = {i:i, x:r.left};
    });
    if (best===null){ var last = heads[heads.length-1].getBoundingClientRect(); best = {i:heads.length, x:last.right}; }
    mv.target = best.i;
    var hr = mv.th.getBoundingClientRect();
    mv.drop.style.left = Math.max(gw.left, Math.min(gw.right, best.x))+'px'; mv.drop.style.top = hr.top+'px'; mv.drop.style.height = Math.max(40, gw.bottom-hr.top)+'px';
  });
  function endMove(){
    if (!mv) return;
    var m = mv; mv = null;
    if (!m.on) return;
    document.body.classList.remove('moving'); m.th.classList.remove('dragging');
    if (m.ghost) m.ghost.remove(); if (m.drop) m.drop.remove();
    suppressClick = Date.now() + 250;
    var keys = colsFor(ui.tab).slice(1).map(function(c){ return c.k; });
    var from = keys.indexOf(m.k); if (from<0 || m.target==null) return;
    var to = m.target; keys.splice(from,1); if (to > from) to--; keys.splice(to,0,m.k);
    colOrder[ui.tab] = keys; saveColOrder(); render();
  }
  document.addEventListener('pointerup', endMove);
  document.addEventListener('pointercancel', endMove);

  function persistUi(){ try{ localStorage.setItem('pl-sheet-ui', JSON.stringify({tab:ui.tab,g:ui.g})); }catch(e){} }

  function setPending(id,k,v){
    var r = rowById(id); if (!r) return;
    k = fk(k);
    pending[r.id] = pending[r.id] || {};
    if (same(v, saved(r,k))) { delete pending[r.id][k]; if (!Object.keys(pending[r.id]).length) delete pending[r.id]; }
    else pending[r.id][k] = v;
    scheduleSave();
  }

  document.addEventListener('click', function(e){
    var t = e.target;
    var tab = t.closest('[data-tab]'); if (tab){ if (editing) commitEdit(); ui.tab = tab.dataset.tab; selected=null; persistUi(); render(); return; }
    if (t.id==='resetcols'){ delete colOrder[ui.tab]; saveColOrder(); colW = {}; saveColW(); render(); return; }
    if (t.id==='undoedit' && selected){
      var r0 = rowById(selected.id); if (r0){ setPending(r0.id, selected.k, orig(r0, selected.k)); render(); }
      return;
    }
    if (t.closest('.rs') || Date.now() < suppressClick) return;
    var sh = t.closest('th[data-sort]'); if (sh){ if (editing) commitEdit(); var k=sh.dataset.sort; if (ui.sort===k) ui.dir=-ui.dir; else { ui.sort=k; ui.dir=1; } render(); return; }
    var tb = t.closest('#themebtn');
    if (tb){
      var next = currentTheme()==='dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('pl-sheet-theme', next); } catch(err){}
      tb.outerHTML = themeButton();
      return;
    }
    if (t.closest('.celled')) return;
    var td = t.closest('td[data-ref]');
    if (td){
      if (editing && !(String(editing.id)===td.dataset.id && editing.k===td.dataset.k)) { commitEdit(); }
      if (t.closest('a')) return;
      selected = {id: td.dataset.id, k: td.dataset.k};
      document.querySelectorAll('td.sel').forEach(function(x){x.classList.remove('sel');});
      var fresh = document.querySelector('td[data-id="'+selected.id+'"][data-k="'+selected.k+'"]'); if (fresh) fresh.classList.add('sel');
      refreshFbar();
    } else if (editing && !t.closest('.fbar')) { commitEdit(); }
  });
  document.addEventListener('dblclick', function(e){
    if (e.target.closest && e.target.closest('.rs')) return;
    if (e.target.closest && e.target.closest('.celled')) return;
    var td = e.target.closest && e.target.closest('td[data-ref]'); if (!td) return;
    if (e.target.closest('a')) e.preventDefault();
    startEdit(td.dataset.id, td.dataset.k);
  });
  document.addEventListener('change', function(e){
    var t = e.target;
    if (t.id==='gf'){ ui.g=t.value; persistUi(); render(); return; }
    if (t.classList.contains('stsel')){ selected = {id:t.dataset.id, k:'status'}; setPending(t.dataset.id,'status',t.value); render(); return; }
    if (t.classList.contains('celled') && t.tagName==='SELECT'){ commitEdit(); return; }
  });
  document.addEventListener('input', function(e){
    var t = e.target;
    if (t.id==='q'){ ui.q=t.value; render('q'); return; }
  });
  document.addEventListener('keydown', function(e){
    var t = e.target;
    if (t.classList && t.classList.contains('celled')){
      if (e.key==='Enter'){ e.preventDefault(); commitEdit([1,0]); }
      else if (e.key==='Tab'){ e.preventDefault(); commitEdit([0, e.shiftKey?-1:1]); }
      else if (e.key==='Escape'){ e.preventDefault(); cancelEdit(); }
      return;
    }
    if (t.tagName==='INPUT' || t.tagName==='SELECT' || t.tagName==='TEXTAREA') return;
    if (!selected) return;
    var map = {ArrowUp:[-1,0], ArrowDown:[1,0], ArrowLeft:[0,-1], ArrowRight:[0,1]};
    if (map[e.key]){ e.preventDefault(); moveSel(map[e.key][0], map[e.key][1], false); return; }
    if (e.key==='Tab'){ e.preventDefault(); moveSel(0, e.shiftKey?-1:1, false); return; }
    if (readOnly) return;
    if (e.key==='Enter' || e.key==='F2'){ e.preventDefault(); startEdit(selected.id, selected.k); return; }
    if ((e.key==='Delete' || e.key==='Backspace') && kindOf(selected.k)==='text'){ e.preventDefault(); setPending(selected.id, selected.k, ''); render(); return; }
    if (e.key.length===1 && !e.ctrlKey && !e.metaKey && !e.altKey && (kindOf(selected.k)==='text' || kindOf(selected.k)==='num')){ e.preventDefault(); startEdit(selected.id, selected.k, e.key); }
  });
  window.addEventListener('beforeunload', function(e){ if ((pendingCount() || editing) && !readOnly && canSave && saveState!=='saving'){ e.preventDefault(); e.returnValue=''; } });

  // ---- autosave: publishes a new version a few seconds after the last change ----
  function scheduleSave(){
    clearTimeout(saveTimer);
    if (readOnly || canSave===false) { setChip(saveState); return; }
    if (!pendingCount()) { setChip('saved'); return; }
    setChip('pending');
    saveTimer = setTimeout(trySave, 3000);
  }
  function trySave(){
    if (!pendingCount()) { setChip('saved'); return; }
    if (editing || (document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('celled'))){ saveTimer = setTimeout(trySave, 2000); return; }
    if (!ns){ saveTimer = setTimeout(trySave, 2000); return; }
    save();
  }

  function buildDoc(state){
    var S = 'scr'+'ipt';
    var st = JSON.stringify(state).replace(/</g,'\\u003c');
    return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+
      '<title>Pipeliners Website Pages</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'+
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">'+
      '<style id="css">'+CSS+'</style></head><body><div id="app-root"></div>'+
      '<'+S+' type="application/json" id="sheet-data">'+DATA_TXT+'</'+S+'>'+
      '<'+S+' type="application/json" id="sheet-state">'+st+'</'+S+'>'+
      '<'+S+' id="app">'+APP+'</'+S+'></body></html>';
  }
  function today(){ var n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); }
  function msg(t){ var m=document.getElementById('savemsg'); if (m) m.textContent=t; }

  function nowStamp(){ var n=new Date(); return MON[n.getMonth()]+' '+n.getDate()+', '+n.getFullYear()+' '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); }
  function save(){
    if (!ns || !pendingCount()) return;
    setChip('saving');
    var edits = JSON.parse(JSON.stringify(STATE.edits));
    var log = STATE.log.slice(-300);
    var when = new Date().toISOString();
    Object.keys(pending).forEach(function(id){
      var r = rowById(id); edits[id] = edits[id] || {};
      Object.keys(pending[id]).forEach(function(k){
        var from = saved(r,k), to = pending[id][k];
        log.push({at: when, id: r.id, page: r.path, field: k, from: from==null?'':from, to: to==null?'':to});
        if (same(to, r[k])) delete edits[id][k]; else edits[id][k] = to;
      });
      if (!Object.keys(edits[id]).length) delete edits[id];
    });
    var next = {updated: today(), savedAt: nowStamp(), edits: edits, log: log};
    try {
      var gw = document.querySelector('.gridwrap');
      sessionStorage.setItem('pl-sheet-view', JSON.stringify({tab:ui.tab, sort:ui.sort, dir:ui.dir, q:ui.q, g:ui.g, sel:selected, sx: gw?gw.scrollLeft:0, sy: gw?gw.scrollTop:0}));
    } catch(e){}
    (function attempt(retried){
      ns.publish(buildDoc(next)).then(function(){ pending = {}; setChip('saved'); }).catch(function(err){
        var c = err && err.code;
        if (c==='conflict'){ setChip('saving'); return; }   // someone else saved first; the page reloads to their version
        if (['not_writer','not_granted','consent_required','capability_disabled','capability_removed','not_declared'].indexOf(c)>-1){ readOnly=true; pending={}; render(); return; }
        if (!retried && (c==='upstream_error' || c==='rate_limited')){ setTimeout(function(){attempt(true);}, c==='rate_limited' ? 30000 : 1500); return; }
        setChip('error'); saveTimer = setTimeout(trySave, 15000);
      });
    })(false);
  }

  render();
  if (window.claude && typeof window.claude.use==='function'){
    window.claude.use('artifact').then(function(x){ ns=x; canSave=!!x; setChip(saveState); }).catch(function(){ canSave=false; setChip(saveState); });
  } else { canSave=false; }
})();
</script>

</body></html>
