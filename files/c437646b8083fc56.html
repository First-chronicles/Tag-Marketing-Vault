<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap">
<style>
:root{
  --ground:#EEF0F6; --paper:#FFFFFF; --head:#E6E8F1; --head-ink:#5E6284;
  --line:#DCDFEA; --line-strong:#C3C7D8; --ink:#17183D; --muted:#5E6284; --faint:#8A8EAA;
  --topbar:#1A1B5E; --topbar-ink:#FFFFFF; --topbar-muted:#B9BBE6;
  --accent:#E2661B; --accent-soft:#FFF1E6; --band:#F5F6FA; --band-ink:#1A1B5E; --hover:#F7F8FC;
  --core-bg:#E5E6F5; --core-fg:#262878; --svc-bg:#FCE7D6; --svc-fg:#A3470A;
  --loc-bg:#D9F0EA; --loc-fg:#135E55; --blog-bg:#EDE3F5; --blog-fg:#63357E;
  --util-bg:#E7E8EE; --util-fg:#50546B;
  --todo-bg:#ECEDF3; --todo-fg:#5E6284; --needs-bg:#FDE3E1; --needs-fg:#A3261B;
  --prog-bg:#DDEBFC; --prog-fg:#1F56A6; --done-bg:#DBF2E2; --done-fg:#1C6B37;
  --warn-bg:#FCEFD3; --warn-fg:#855600;
  --todo-bar:#C9CCDA; --needs-bar:#E0574A; --prog-bar:#3B7DDD; --done-bar:#2F9A55;
  --input-bg:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E0F1E; --paper:#16172A; --head:#1D1F34; --head-ink:#9A9DBC;
    --line:#282A43; --line-strong:#383B59; --ink:#E6E7F4; --muted:#A1A4C2; --faint:#74789A;
    --topbar:#15164A; --topbar-ink:#FFFFFF; --topbar-muted:#A9ACE0;
    --accent:#F27A30; --accent-soft:#2E2230; --band:#1B1C31; --band-ink:#C9CBFF; --hover:#1B1C30;
    --core-bg:#272962; --core-fg:#C8CAFF; --svc-bg:#4A2A14; --svc-fg:#FFB582;
    --loc-bg:#123C37; --loc-fg:#86DCCB; --blog-bg:#3A2549; --blog-fg:#DDB8F2;
    --util-bg:#2A2C3E; --util-fg:#B7BACD;
    --todo-bg:#25273A; --todo-fg:#A1A4C2; --needs-bg:#4A1E1C; --needs-fg:#FF9E94;
    --prog-bg:#1B3354; --prog-fg:#9FC6FF; --done-bg:#173B25; --done-fg:#8FDCA6;
    --warn-bg:#3F3113; --warn-fg:#F4C66B;
    --todo-bar:#3A3D57; --needs-bar:#E0574A; --prog-bar:#4A8BEA; --done-bar:#3DAA63;
    --input-bg:#1B1C30;
  }
}
:root[data-theme="dark"]{
  --ground:#0E0F1E; --paper:#16172A; --head:#1D1F34; --head-ink:#9A9DBC;
  --line:#282A43; --line-strong:#383B59; --ink:#E6E7F4; --muted:#A1A4C2; --faint:#74789A;
  --topbar:#15164A; --topbar-ink:#FFFFFF; --topbar-muted:#A9ACE0;
  --accent:#F27A30; --accent-soft:#2E2230; --band:#1B1C31; --band-ink:#C9CBFF; --hover:#1B1C30;
  --core-bg:#272962; --core-fg:#C8CAFF; --svc-bg:#4A2A14; --svc-fg:#FFB582;
  --loc-bg:#123C37; --loc-fg:#86DCCB; --blog-bg:#3A2549; --blog-fg:#DDB8F2;
  --util-bg:#2A2C3E; --util-fg:#B7BACD;
  --todo-bg:#25273A; --todo-fg:#A1A4C2; --needs-bg:#4A1E1C; --needs-fg:#FF9E94;
  --prog-bg:#1B3354; --prog-fg:#9FC6FF; --done-bg:#173B25; --done-fg:#8FDCA6;
  --warn-bg:#3F3113; --warn-fg:#F4C66B;
  --todo-bar:#3A3D57; --needs-bar:#E0574A; --prog-bar:#4A8BEA; --done-bar:#3DAA63;
  --input-bg:#1B1C30;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:13px/1.45 Montserrat,"Segoe UI",system-ui,sans-serif;}
.app{display:flex;flex-direction:column;height:100dvh;min-height:600px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}

/* top bar */
.topbar{background:var(--topbar);color:var(--topbar-ink);display:flex;align-items:center;gap:16px;padding:12px 18px;flex-wrap:wrap}
.doc{display:flex;align-items:center;gap:12px;min-width:0}
.doc-icon{width:30px;height:30px;border-radius:5px;background:var(--accent);display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:6px;flex:none}
.doc-icon i{background:rgba(255,255,255,.85);border-radius:1px}
.doc h1{font:600 20px/1.1 Oswald,"Arial Narrow",Impact,sans-serif;letter-spacing:.02em;margin:0;text-transform:uppercase}
.doc p{margin:2px 0 0;color:var(--topbar-muted);font-size:12px}
.sync{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--topbar-muted)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:#8A8EAA}
.sync[data-s="live"] .dot,.sync[data-s="saved"] .dot{background:#46C274}
.sync[data-s="saving"] .dot{background:#F2B33D}
.sync[data-s="error"] .dot{background:#FF6B5E}
.theme{display:flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:3px;gap:2px}
.theme button{border:0;background:transparent;color:var(--topbar-muted);display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer}
.theme button:hover{color:var(--topbar-ink);background:rgba(255,255,255,.08)}
.theme button[aria-pressed="true"]{background:var(--topbar-ink);color:var(--topbar)}
.theme svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.theme button[data-mode="dark"] svg{fill:currentColor;stroke:none}
.theme button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* toolbar */
.toolbar{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:1 1 240px;max-width:340px}
.search input{width:100%;height:34px;border:1px solid var(--line-strong);border-radius:6px;background:var(--input-bg);padding:0 10px 0 32px}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:2}
.pick{height:34px;border:1px solid var(--line-strong);border-radius:6px;background:var(--input-bg);padding:0 8px;min-width:150px}
.progress{display:flex;flex-direction:column;gap:6px;flex:1 1 320px;min-width:260px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--todo-bar)}
.bar span{display:block;height:100%}
.legend{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.legend button{border:0;background:none;padding:2px 4px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--muted)}
.legend button:hover{background:var(--hover);color:var(--ink)}
.legend button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.legend b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.sw{width:9px;height:9px;border-radius:2px;display:inline-block}

/* summary strip */
.summary{background:var(--paper);border-bottom:1px solid var(--line);padding:8px 18px;display:flex;gap:8px 10px;align-items:stretch;flex-wrap:wrap}
.stat{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 12px;display:flex;flex-direction:column;justify-content:center;min-width:104px;text-align:left}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--line-strong);background:var(--hover)}
button.stat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.stat b{font:600 18px/1.15 Oswald,"Arial Narrow",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.stat span{font-size:11px;color:var(--muted)}
.stat.good b{color:var(--done-fg)} .stat.warn b{color:var(--warn-fg)} .stat.bad b{color:var(--needs-fg)}
.sources{margin-left:auto;align-self:center;font-size:11px;color:var(--faint);max-width:420px;text-align:right;line-height:1.5}
.sources b{color:var(--muted);font-weight:600}

/* formula bar */
.fbar{display:flex;align-items:stretch;background:var(--paper);border-bottom:1px solid var(--line);min-height:34px}
.namebox{width:78px;flex:none;border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.fx{width:36px;flex:none;border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:italic 600 14px/1 Georgia,serif;color:var(--faint)}
.fcontent{flex:1;display:flex;align-items:center;gap:6px 12px;padding:6px 12px;min-width:0;flex-wrap:wrap}
.fcontent .hint{color:var(--faint)}
.fcontent .fcol{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.fcontent .ftext{color:var(--ink);word-break:break-word}
.fcontent .flen{font-size:11px;color:var(--faint);white-space:nowrap}
.fcontent a{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
.fcontent a:hover{text-decoration:underline}

/* grid */
.gridwrap{flex:1;overflow:auto;background:var(--paper);position:relative}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 10px;vertical-align:top;text-align:left;background:var(--paper)}
thead th{position:sticky;background:var(--head);color:var(--head-ink);font-weight:600;z-index:3;white-space:nowrap}
thead tr.letters th{top:0;height:22px;padding:2px 10px;text-align:center;font-size:11px;font-weight:500;color:var(--faint)}
thead tr.names th{top:22px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line-strong)}
thead tr.names th button{all:unset;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
thead tr.names th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.arrow{color:var(--accent);font-size:12px;letter-spacing:0}
.rn{position:sticky;left:0;z-index:2;width:44px;min-width:44px;text-align:center;background:var(--head);color:var(--faint);font-weight:500;font-size:11px;font-variant-numeric:tabular-nums;padding:8px 4px}
thead .rn{z-index:4}
.k-seo{position:sticky;left:44px;z-index:1;width:280px;min-width:280px;max-width:280px;font-weight:600;color:var(--ink);box-shadow:1px 0 0 var(--line-strong)}
thead .k-seo{z-index:4}
tbody tr:hover td{background:var(--hover)}
tbody tr.sel td{background:var(--accent-soft)}
tbody tr.sel .rn{background:var(--accent);color:#fff}
tbody td.cur{box-shadow:inset 0 0 0 2px var(--accent)}
tbody td.k-seo.cur{box-shadow:inset 0 0 0 2px var(--accent),1px 0 0 var(--line-strong)}
.k-type{width:92px}
.k-slug{width:210px;min-width:210px;max-width:210px;font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all;color:var(--muted)}
.k-kw{width:200px;min-width:200px;max-width:200px}
.k-kwchk{width:300px;min-width:300px;max-width:300px}
.kc-ok{background:var(--done-bg);color:var(--done-fg)}
.kc-warn{background:var(--warn-bg);color:var(--warn-fg)}
.kc-none{background:var(--todo-bg);color:var(--todo-fg)}
.k-desc{width:330px;min-width:330px;max-width:330px;color:var(--muted)}
.k-link{width:270px;min-width:270px;max-width:270px}
.k-link a{color:var(--ink);text-decoration:none;font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}
.k-link a:hover{color:var(--accent);text-decoration:underline}
.k-pub{width:124px;min-width:124px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
.k-idx{width:180px;min-width:180px;max-width:180px}
.k-loc{width:150px;min-width:150px}
.k-clicks,.k-impr{width:96px;text-align:right;font-variant-numeric:tabular-nums}
.k-impr{width:124px}
thead .k-clicks,thead .k-impr{text-align:right}
.k-status{width:150px}
.k-note{width:260px;min-width:260px}
.none{color:var(--faint)}
.len{display:block;font-size:10.5px;font-weight:500;color:var(--faint);margin-top:2px;font-family:Montserrat,sans-serif}
.sub{display:block;font-size:11px;color:var(--faint);margin-top:3px;line-height:1.35}
.sub.alert{color:var(--needs-fg)}
.num{font-weight:600;color:var(--ink)}
.num.zero{color:var(--faint);font-weight:500}

.chip{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
.t-Core{background:var(--core-bg);color:var(--core-fg)}
.t-Service{background:var(--svc-bg);color:var(--svc-fg)}
.t-Local{background:var(--loc-bg);color:var(--loc-fg)}
.t-Blog{background:var(--blog-bg);color:var(--blog-fg)}
.t-Utility{background:var(--util-bg);color:var(--util-fg)}
.i-yes{background:var(--done-bg);color:var(--done-fg)}
.i-no{background:var(--warn-bg);color:var(--warn-fg)}
.i-unknown{background:var(--todo-bg);color:var(--todo-fg)}
.i-noindex{background:var(--needs-bg);color:var(--needs-fg)}
.missing{background:var(--needs-bg);color:var(--needs-fg)}

.stwrap{position:relative;display:inline-block}
.stwrap::after{content:"";position:absolute;right:9px;top:50%;margin-top:-2px;border:4px solid transparent;border-top-color:currentColor;pointer-events:none;opacity:.7}
.st{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:3px 24px 3px 10px;font-size:12px;font-weight:600;cursor:pointer}
.s-todo{background:var(--todo-bg);color:var(--todo-fg)}
.s-needs{background:var(--needs-bg);color:var(--needs-fg)}
.s-progress{background:var(--prog-bg);color:var(--prog-fg)}
.s-done{background:var(--done-bg);color:var(--done-fg)}
.st option{background:var(--paper);color:var(--ink)}

.note{width:100%;min-height:26px;resize:none;border:1px solid transparent;border-radius:4px;background:transparent;padding:3px 6px;line-height:1.4;overflow:hidden;display:block}
.note:hover{border-color:var(--line)}
.note:focus{border-color:var(--accent);background:var(--input-bg);outline:none}
.note::placeholder{color:var(--faint)}

tr.band td{background:var(--band);color:var(--band-ink);font:600 13px/1.2 Oswald,"Arial Narrow",sans-serif;letter-spacing:.05em;text-transform:uppercase;padding:9px 12px;border-bottom-color:var(--line-strong)}
tr.band th.rn{background:var(--head)}
tr.band:hover td{background:var(--band)}
tr.band small{font:500 12px Montserrat,sans-serif;letter-spacing:0;text-transform:none;color:var(--muted);margin-left:8px}
.band-in{position:sticky;left:56px;display:inline-block}
.empty{padding:40px 20px;color:var(--muted);text-align:left}

/* sheet tabs */
.tabs{display:flex;align-items:stretch;background:var(--head);border-top:1px solid var(--line-strong);overflow-x:auto;padding:0 8px;flex:none}
.tab{border:0;background:transparent;padding:9px 16px 8px;display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;border-right:1px solid var(--line)}
.tab:hover{background:var(--hover);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .count{background:var(--accent);color:#fff}
.tabs .foot{margin-left:auto;display:flex;align-items:center;padding:0 10px;color:var(--faint);font-size:11px;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-size:12px;font-weight:500;z-index:10}

.search.kws input{border-color:var(--accent)}
.kwbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 18px;background:var(--accent-soft);color:var(--ink);border-bottom:1px solid var(--line);font-size:12.5px}
.kwbar.warn{background:var(--needs-bg);color:var(--needs-fg)}
.kwbar b{font-weight:600}
.kwbar button{margin-left:auto;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}
.kwbar button:hover{background:var(--hover)}
.chip.clash{background:var(--needs-bg);color:var(--needs-fg);margin-left:6px}
@media (max-width:720px){
  .k-seo{width:200px;min-width:200px;max-width:200px}
  .topbar,.toolbar,.summary{padding-left:12px;padding-right:12px}
  .namebox{width:56px}
  .sources{margin-left:0;text-align:left}
  .tabs .foot{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

h":"/404-2/","svc":"404 page","mod":"2026-03-07","pub":"2021-04-10","slug":"404-2","seoTitle":"404 page – Alphalete Trenchless","robots":"noindex","clicks":0,"impr":0,"idx":"noindex","idxNote":"Unknown to Google, noindex on purpose","kwSt":"none","kwChk":"Not an SEO page (utility, legal or ads landing page), so not checked"},{"id":5068,"type":"Utility","title":"Terms of Service","path":"/terms-of-service/","svc":"Legal","mod":"2026-07-13","pub":"2026-02-13","slug":"terms-of-service","seoTitle":"Terms of Service | Alphalete Trenchless Services","metaDesc":"Review Alphalete Trenchless's Terms of Service for website and sewer repair services. Understand our policies on estimates, SMS, and disclaimers.","keyword":"terms of service","robots":"max-image-preview:large","clicks":0,"impr":0,"idx":"yes","idxNote":"Newly indexed Sep 25 (no request needed)","kwSt":"none","kwChk":"Not an SEO page (utility, legal or ads landing page), so not checked"},{"id":11152,"type":"Utility","title":"Thank you","path":"/thank-you/","svc":"Thank-you page","mod":"2026-04-29","pub":"2026-04-29","slug":"thank-you","seoTitle":"Thank you – Alphalete Trenchless","robots":"noindex, follow (X-Robots-Tag)","clicks":0,"impr":0,"idx":"noindex","kwSt":"none","kwChk":"Not an SEO page (utility, legal or ads landing page), so not checked"},{"id":15864,"type":"Blog","title":"What Is Orangeburg Pipe? How to Identify and Replace It in Colorado","path":"/blog/orangeburg-sewer-pipe-colorado/","svc":"Sewer Repair","mod":"2026-09-16","pub":"2026-09-16","slug":"orangeburg-sewer-pipe-colorado","seoTitle":"What Is Orangeburg Pipe? Identify & Replace It in Colorado","metaDesc":"What is Orangeburg pipe? Learn how to identify it, why it collapses, and what affects replacement cost in older Colorado homes. Book a camera inspection.","keyword":"what is orangeburg pipe","robots":"max-image-preview:large","clicks":0,"impr":41,"idx":"yes","kwSt":"ok","kwChk":"Live page: title and H1 both match"}]</script>
<script>
const META = JSON.parse(document.getElementById('meta').textContent);
const ROWS = JSON.parse(document.getElementById('data').textContent);
const SITE = 'https://alphaletetrenchless.com';
ROWS.forEach(r => { r.key = r.id ? String(r.id) : 'static-pipelining'; r.url = SITE + r.path; r.loc = r.city ? r.city + ', CO' : ''; });

const TABS = [
  {k:'All', label:'All pages'}, {k:'Core', label:'Core pages'}, {k:'Service', label:'Service pages'},
  {k:'Local', label:'Local pages'}, {k:'Blog', label:'Blog posts'}, {k:'Utility', label:'Utility & legal'}
];
const TYPE_LABEL = {Core:'Core pages', Service:'Service pages', Local:'Local pages', Blog:'Blog posts', Utility:'Utility & legal'};
const STATUSES = [
  {k:'done', label:'Done', bar:'--done-bar'},
  {k:'progress', label:'In progress', bar:'--prog-bar'},
  {k:'needs', label:'Needs work', bar:'--needs-bar'},
  {k:'todo', label:'Not checked', bar:'--todo-bar'}
];
const STATUS_ORDER = {needs:0, progress:1, todo:2, done:3};
const IDX_ORDER = {discovered:0, crawled:1, unknown:2, noindex:3, yes:4};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('en-US');
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = d => { const [y,m,dd] = d.split('-'); return MONTHS[+m-1] + ' ' + (+dd) + ', ' + y; };
const track = {};
const statusOf = r => (track[r.key] && track[r.key].status) || 'todo';
const noteOf = r => (track[r.key] && track[r.key].note) || '';
const isIndexed = r => r.idx === 'yes';

function idxLabel(r){
  if(r.idx === 'yes') return 'Indexed';
  if(r.idx === 'discovered' || r.idx === 'crawled') return 'Not indexed';
  if(r.idx === 'noindex') return 'Blocked (noindex)';
  return 'Not in report yet';
}
function idxDetail(r){
  const out = [];
  if(r.idx === 'yes' && r.crawl) out.push('Last crawled ' + r.crawl);
  if(r.idx === 'discovered') out.push('Google found it but has not crawled it yet');
  if(r.idx === 'crawled') out.push('Google crawled it and chose not to index it');
  if(r.idx === 'unknown') out.push('Too new for Google’s report');
  if(r.idx === 'noindex') out.push('Page tells Google not to index it');
  if(r.idxNote) out.push(r.idxNote);
  else if(r.idx === 'yes' && /noindex/i.test(r.robots || '')) out.push('!Live page now has a noindex tag, so it will drop out');
  if(r.oldIdx) out.push('Old URL /' + r.slug + '/ is still indexed and redirects here');
  return out;
}

/* keyword check: looks only at the primary keyword, across every tab */
const KW_STOP = new Set(['in','the','a','an','for','of','to','az','arizona','co','colorado','near','me','my','and','on']);
const kwText = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const kwTokens = s => kwText(s).split(' ').filter(w => w && !KW_STOP.has(w));
// Two keywords clash when they have the same words, ignoring order and filler (in, co, the...).
const kwKey = s => [...new Set(kwTokens(s))].sort().join(' ');
function kwMatch(r, q){
  const k = kwText(r.keyword); if(!k) return false;
  let qt = kwTokens(q); if(!qt.length) qt = kwText(q).split(' ').filter(Boolean);
  return qt.every(w => k.includes(w));
}
const kwLive = r => r.idx !== 'noindex' && !/noindex/i.test(r.robots || '');   // noindex pages can't compete
function clashGroups(){
  const g = {};
  ROWS.forEach(r => { const k = kwKey(r.keyword); if(!k || !kwLive(r)) return; (g[k] = g[k] || []).push(r); });
  Object.keys(g).forEach(k => { if(g[k].length < 2) delete g[k]; });
  return g;
}
let CLASH = {};
const kwMode = () => !!view.kq.trim() || view.flag === 'clash';
const clashOthers = r => { const g = r.keyword && kwLive(r) ? CLASH[kwKey(r.keyword)] : null; return g ? g.filter(x => x !== r) : []; };

/* column definitions */
const C = {
  seo:   {label:'SEO title', cls:'k-seo', sort:r => (r.seoTitle || r.title).toLowerCase(),
          text:r => r.seoTitle || r.title,
          html:r => esc(r.seoTitle || r.title) + '<span class="len">' + (r.seoTitle || '').length + ' characters</span>'},
  type:  {label:'Type', cls:'k-type', sort:r => r.type, text:r => r.type,
          html:r => '<span class="chip t-' + r.type + '">' + r.type + '</span>'},
  slug:  {label:'Slug', cls:'k-slug', sort:r => r.slug, text:r => r.slug, html:r => esc(r.slug)},
  kw:    {label:'Primary keyword', cls:'k-kw', sort:r => (r.keyword || '~').toLowerCase(),
          text:r => { const o = clashOthers(r); return (r.keyword || 'Not set') + (o.length ? '. Same keyword as: ' + o.map(x => x.path + ' (' + TYPE_LABEL[x.type] + ')').join(', ') : ''); },
          html:r => { const o = clashOthers(r); return (r.keyword ? esc(r.keyword) : '<span class="none">Not set</span>') +
            (o.length ? '<span class="chip clash" title="Same keyword as ' + esc(o.map(x => x.path).join(', ')) + '">' + (o.length + 1) + ' pages</span>' : ''); }},
  kwchk: {label:'Live + Search Atlas check', cls:'k-kwchk', sort:r => ({warn:0, none:1, ok:2})[r.kwSt],
          text:r => (r.kwChk || 'Not checked') + '. Checked ' + (META.kwChecked || ''),
          html:r => '<span class="chip kc-' + (r.kwSt || 'none') + '">' + ({ok:'Matches', warn:'Check', none:'No keyword'})[r.kwSt || 'none'] + '</span>' +
                    String(r.kwChk || '').split('. ').map(s => '<span class="sub">' + esc(s) + '</span>').join('')},
  desc:  {label:'Meta description', cls:'k-desc', sort:r => r.metaDesc ? r.metaDesc.length : -1, text:r => r.metaDesc || 'Missing: no meta description on the live page',
          html:r => r.metaDesc ? esc(r.metaDesc) + '<span class="len">' + r.metaDesc.length + ' characters</span>' : '<span class="chip missing">Missing</span>'},
  link:  {label:'Permalink', cls:'k-link', sort:r => r.path, text:r => r.url,
          html:r => '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.url.replace('https://','')) + '</a>'},
  pub:   {label:'Date published', cls:'k-pub', sort:r => r.pub || '', text:r => r.pub ? fmtDate(r.pub) : 'Not in WordPress (static page)',
          html:r => r.pub ? fmtDate(r.pub) : '<span class="none">Not in WP</span>'},
  idx:   {label:'Indexed?', cls:'k-idx', sort:r => IDX_ORDER[r.idx], text:r => idxLabel(r) + '. ' + idxDetail(r).map(s => s.replace(/^!/,'')).join('. '),
          html:r => '<span class="chip ' + (r.idx === 'yes' ? 'i-yes' : r.idx === 'noindex' ? 'i-noindex' : r.idx === 'unknown' ? 'i-unknown' : 'i-no') + '">' + idxLabel(r) + '</span>' +
                    idxDetail(r).map(s => s[0] === '!' ? '<span class="sub alert">' + esc(s.slice(1)) + '</span>' : '<span class="sub">' + esc(s) + '</span>').join('')},
  loc:   {label:'Location', cls:'k-loc', sort:r => r.loc, text:r => r.loc || 'None', html:r => r.loc ? esc(r.loc) : '<span class="none">&ndash;</span>'},
  clicks:{label:'Clicks', cls:'k-clicks', sort:r => r.clicks, text:r => fmt(r.clicks) + ' clicks in the last 3 months (US)',
          html:r => '<span class="num' + (r.clicks ? '' : ' zero') + '">' + fmt(r.clicks) + '</span>'},
  impr:  {label:'Impressions', cls:'k-impr', sort:r => r.impr, text:r => fmt(r.impr) + ' impressions in the last 3 months (US)' + (r.oldImpr ? '. Plus ' + fmt(r.oldImpr) + ' on old URLs that now redirect here' : ''),
          html:r => '<span class="num' + (r.impr ? '' : ' zero') + '">' + fmt(r.impr) + '</span>' + (r.oldImpr ? '<span class="sub">+' + fmt(r.oldImpr) + ' on old URLs</span>' : '')},
  status:{label:'Status', cls:'k-status', sort:r => STATUS_ORDER[statusOf(r)], text:r => (STATUSES.find(s => s.k === statusOf(r)) || {}).label, html:r => statusSelect(r)},
  note:  {label:'Notes', cls:'k-note', nosort:true, text:r => noteOf(r) || 'No note yet', html:r => '<textarea class="note" rows="1" data-key="' + r.key + '" placeholder="Add a note" aria-label="Note for ' + esc(r.title) + '">' + esc(noteOf(r)) + '</textarea>'}
};
const LAYOUT = {
  All:     ['seo','type','slug','kw','kwchk','desc','link','pub','idx','clicks','impr','status','note'],
  Local:   ['seo','slug','kw','kwchk','desc','link','pub','idx','loc','clicks','impr','status','note'],
  Blog:    ['seo','slug','kw','kwchk','desc','link','pub','idx','clicks','impr','status','note'],
  Core:    ['seo','slug','kw','kwchk','desc','link','pub','idx','clicks','impr','status','note'],
  Service: ['seo','slug','kw','kwchk','desc','link','pub','idx','clicks','impr','status','note'],
  Utility: ['seo','slug','kw','kwchk','desc','link','pub','idx','clicks','impr','status','note']
};
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const cols = () => LAYOUT[kwMode() ? 'All' : view.tab];

const view = {tab:'Local', q:'', kq:'', status:'', svc:'', flag:'', sort:null, dir:1, selected:null, cell:null};
let db = null;

function inTab(r){ return view.tab === 'All' || r.type === view.tab; }
function passFlag(r){
  if(view.flag === 'indexed') return isIndexed(r);
  if(view.flag === 'notindexed') return !isIndexed(r);
  if(view.flag === 'nometa') return !r.metaDesc;
  if(view.flag === 'nokw') return !r.keyword;
  if(view.flag === 'kwwarn') return r.kwSt === 'warn';
  return true;
}
function filtered(){
  const q = view.q.trim().toLowerCase(), kq = view.kq.trim();
  const inView = r => {
    if(kq) return kwMatch(r, kq);
    if(view.flag === 'clash'){ const k = kwKey(r.keyword); return !!(k && CLASH[k] && kwLive(r)); }
    return inTab(r) && passFlag(r) && (!view.svc || r.svc === view.svc);
  };
  let list = ROWS.filter(r => inView(r)
    && (!view.status || statusOf(r) === view.status)
    && (!q || [r.title, r.seoTitle, r.keyword, r.metaDesc, r.path, r.city, r.svc, noteOf(r)].join(' ').toLowerCase().includes(q)));
  if(view.sort){
    const f = C[view.sort].sort;
    list = list.slice().sort((a,b) => { const x = f(a), y = f(b); return (x < y ? -1 : x > y ? 1 : 0) * view.dir; });
  } else if(kwMode()){
    list = list.slice().sort((a,b) => kwKey(a.keyword).localeCompare(kwKey(b.keyword)) || a.path.localeCompare(b.path));
  }
  return list;
}
function groupKey(r){
  if(view.sort) return null;
  if(kwMode()) return view.kq.trim() ? null : 'kw:' + kwKey(r.keyword);
  if(view.tab === 'All') return r.type;
  if(view.tab === 'Local') return r.svc;
  return null;
}

function statusSelect(r){
  const s = statusOf(r);
  return '<span class="stwrap"><select class="st s-' + s + '" data-key="' + r.key + '" aria-label="Status for ' + esc(r.title) + '">' +
    STATUSES.slice().reverse().map(o => '<option value="' + o.k + '"' + (o.k === s ? ' selected' : '') + '>' + o.label + '</option>').join('') +
    '</select></span>';
}

function renderHeads(){
  const cs = cols();
  $('letters').innerHTML = '<th class="rn"></th>' + cs.map((k,i) => '<th class="' + C[k].cls + '">' + LETTERS[i] + '</th>').join('');
  $('heads').innerHTML = '<th class="rn"></th>' + cs.map(k => {
    const c = C[k];
    const arrow = view.sort === k ? '<span class="arrow">' + (view.dir > 0 ? '&#8593;' : '&#8595;') + '</span>' : '';
    return '<th class="' + c.cls + '"' + (view.sort === k ? ' aria-sort="' + (view.dir > 0 ? 'ascending' : 'descending') + '"' : '') + '>' +
      (c.nosort ? c.label : '<button type="button" data-sort="' + k + '" title="Sort by ' + c.label + '">' + c.label + arrow + '</button>') + '</th>';
  }).join('');
}

function renderTabs(){
  $('tabs').innerHTML = TABS.map(t => {
    const n = t.k === 'All' ? ROWS.length : ROWS.filter(r => r.type === t.k).length;
    return '<button class="tab" role="tab" aria-selected="' + (view.tab === t.k) + '" data-tab="' + t.k + '">' + t.label + '<span class="count">' + n + '</span></button>';
  }).join('') + '<span class="foot">Status and notes save for everyone who opens this sheet</span>';
}

function renderSvcOptions(){
  const opts = [...new Set(ROWS.filter(inTab).map(r => r.svc).filter(Boolean))].sort();
  if(view.svc && !opts.includes(view.svc)) view.svc = '';
  $('svc').innerHTML = '<option value="">' + (view.tab === 'Blog' ? 'All blog topics' : 'All services') + '</option>' +
    opts.map(o => '<option' + (o === view.svc ? ' selected' : '') + '>' + esc(o) + '</option>').join('');
}

function renderSummary(){
  const base = ROWS.filter(inTab);
  const n = base.length;
  const yes = base.filter(isIndexed).length;
  const noMeta = base.filter(r => !r.metaDesc).length;
  const noKw = base.filter(r => !r.keyword).length;
  const impr = base.reduce((s,r) => s + (r.impr || 0), 0);
  const clicks = base.reduce((s,r) => s + (r.clicks || 0), 0);
  const btn = (flag, value, label, tone) => '<button type="button" class="stat ' + tone + '" data-flag="' + flag + '" aria-pressed="' + (view.flag === flag) + '" title="Show only these pages"><b>' + value + '</b><span>' + label + '</span></button>';
  $('summary').innerHTML =
    '<div class="stat"><b>' + n + '</b><span>pages in this tab</span></div>' +
    btn('indexed', yes + ' <small style="font-size:12px;color:var(--faint)">of ' + n + '</small>', 'indexed by Google', 'good') +
    btn('notindexed', n - yes, 'not indexed yet', n - yes ? 'warn' : '') +
    btn('nometa', noMeta, 'missing meta description', noMeta ? 'bad' : '') +
    (noKw ? btn('nokw', noKw, 'no primary keyword', 'warn') : '') +
    btn('kwwarn', base.filter(r => r.kwSt === 'warn').length, 'keyword checks to look at', base.some(r => r.kwSt === 'warn') ? 'warn' : '') +
    btn('clash', Object.keys(CLASH).length, 'keyword clashes, all tabs', Object.keys(CLASH).length ? 'bad' : '') +
    '<div class="stat"><b>' + fmt(impr) + '</b><span>impressions, 3 months</span></div>' +
    '<div class="stat"><b>' + fmt(clicks) + '</b><span>clicks, 3 months</span></div>' +
    '<div class="sources"><b>Clicks and impressions:</b> Google Search Console, ' + esc(META.gscRange) + ', US searches. ' +
    '<b>Indexed?:</b> Search Console Page indexing report. <b>Titles, descriptions, keywords:</b> read from the live site. All checked ' + esc(META.checked) + '. <b>Keyword check:</b> live title and H1 plus Search Atlas rank tracker, ' + esc(META.kwChecked || '') + '.</div>';
}

function renderProgress(){
  const base = ROWS.filter(inTab);
  const counts = {done:0, progress:0, needs:0, todo:0};
  base.forEach(r => counts[statusOf(r)]++);
  const total = base.length || 1;
  $('bar').innerHTML = STATUSES.map(s => counts[s.k] ? '<span style="width:' + (counts[s.k]/total*100) + '%;background:var(' + s.bar + ')"></span>' : '').join('');
  $('legend').innerHTML = '<span class="lbl">Your status</span>' + STATUSES.map(s =>
    '<button type="button" data-status="' + s.k + '" aria-pressed="' + (view.status === s.k) + '" title="Show only ' + s.label + '">' +
    '<span class="sw" style="background:var(' + s.bar + ')"></span>' + s.label + ' <b>' + counts[s.k] + '</b></button>').join('') +
    (view.status ? '<button type="button" data-status="">Show all</button>' : '');
}

function rowHtml(r, n){
  return '<tr data-key="' + r.key + '"' + (view.selected === r.key ? ' class="sel"' : '') + '>' +
    '<th class="rn" scope="row">' + n + '</th>' +
    cols().map((k,i) => '<td class="' + C[k].cls + '" data-col="' + k + '" data-letter="' + LETTERS[i] + '">' + C[k].html(r) + '</td>').join('') + '</tr>';
}

function renderKwBar(list){
  const bar = $('kwbar');
  if(!kwMode()){ bar.hidden = true; return; }
  const by = {}; list.forEach(r => { const n = TYPE_LABEL[r.type] || r.type; by[n] = (by[n] || 0) + 1; });
  const split = Object.keys(by).map(n => n + ' ' + by[n]).join(' · ');
  const back = '<button type="button" id="kwclear">Back to ' + esc((TABS.find(t => t.k === view.tab) || TABS[0]).label) + '</button>';
  const kq = view.kq.trim();
  let warn, msg;
  if(!kq){
    const n = Object.keys(CLASH).length; warn = n > 0;
    msg = n ? '<b>' + n + ' keyword' + (n === 1 ? ' is' : 's are') + ' the primary keyword on 2 or more live pages</b> (' + list.length + ' pages: ' + esc(split) + '). Pages that target the same keyword compete with each other in Google.'
      : '<b>No keyword clashes.</b> No two live pages share the same primary keyword.';
  } else {
    const off = list.filter(r => !kwLive(r)).length, seen = {}, dup = [];
    list.forEach(r => { const k = kwKey(r.keyword); if(CLASH[k] && !seen[k]){ seen[k] = 1; dup.push('“' + esc(r.keyword) + '” on ' + CLASH[k].length + ' pages'); } });
    warn = dup.length > 0;
    msg = '<b>' + list.length + ' page' + (list.length === 1 ? '' : 's') + '</b> have “' + esc(kq) + '” in the primary keyword' + (list.length ? ' (' + esc(split) + ')' : '') + '.' +
      (off ? ' ' + off + ' of them are noindex, so they don’t count.' : '') +
      (dup.length ? ' Same keyword on more than one live page: ' + dup.join('; ') + '.' : (list.length ? ' No two live pages share the exact same keyword.' : ' Nothing to clash with.'));
  }
  bar.className = 'kwbar' + (warn ? ' warn' : ''); bar.innerHTML = '<span>' + msg + '</span>' + back; bar.hidden = false;
}

function render(){
  CLASH = clashGroups();
  renderHeads(); renderTabs(); renderSvcOptions(); renderSummary(); renderProgress();
  const list = filtered();
  renderKwBar(list);
  const KWL = {}; Object.keys(CLASH).forEach(k => { KWL['kw:' + k] = 'Keyword: “' + CLASH[k][0].keyword + '”'; });
  const width = cols().length + 1;
  let html = '', last, n = 0;
  const groupCounts = {};
  list.forEach(r => { const g = groupKey(r); if(g) groupCounts[g] = (groupCounts[g] || 0) + 1; });
  list.forEach(r => {
    const g = groupKey(r);
    if(g && g !== last){
      html += '<tr class="band"><th class="rn"></th><td colspan="' + (width - 1) + '"><span class="band-in">' + esc(TYPE_LABEL[g] || KWL[g] || g) + '<small>' + groupCounts[g] + ' ' + (groupCounts[g] === 1 ? 'page' : 'pages') + '</small></span></td></tr>';
      last = g;
    }
    html += rowHtml(r, ++n);
  });
  if(!list.length) html = '<tr><td colspan="' + width + '" class="empty">' + (view.kq.trim() ? 'No page uses a primary keyword with “' + esc(view.kq.trim()) + '”. Nothing to clash with.' : 'No pages match. Clear the search or the filters above to see more.') + '</td></tr>';
  $('tbody').innerHTML = html;
  $('tbody').querySelectorAll('.note').forEach(grow);
}

function grow(t){ t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; }

function showCell(td){
  const tr = td.closest('tr[data-key]'); if(!tr) return;
  const r = ROWS.find(x => x.key === tr.dataset.key); if(!r) return;
  document.querySelectorAll('tbody tr.sel').forEach(x => x.classList.remove('sel'));
  document.querySelectorAll('tbody td.cur').forEach(x => x.classList.remove('cur'));
  tr.classList.add('sel'); td.classList.add('cur');
  view.selected = r.key;
  const k = td.dataset.col, c = C[k];
  $('namebox').textContent = td.dataset.letter + tr.querySelector('.rn').textContent;
  const text = c.text(r);
  const len = (k === 'seo' || k === 'desc') && text && !/^Missing/.test(text) ? '<span class="flen">' + text.length + ' characters</span>' : '';
  $('fcontent').innerHTML = '<span class="fcol">' + c.label + '</span><span class="ftext">' + esc(text) + '</span>' + len +
    '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">Open page &#8599;</a>';
}

let toastTimer;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3200); }
function setSync(s, text){ $('sync').dataset.s = s; $('syncText').textContent = text; }

async function save(key){
  const rec = track[key] || {};
  if(!db){ setSync('local', 'Changes stay on this screen only'); return; }
  setSync('saving', 'Saving…');
  const body = {status: rec.status || 'todo', note: rec.note || '', updatedAt: new Date().toISOString()};
  const attempt = () => db.doc('tracking/' + key).set(body);
  try { await attempt(); setSync('saved', 'All changes saved'); }
  catch(e){
    if(e && e.code === 'unavailable'){
      await new Promise(res => setTimeout(res, 600 + Math.random()*600));
      try { await attempt(); setSync('saved', 'All changes saved'); return; } catch(e2){ e = e2; }
    }
    setSync('error', 'Not saved');
    toast(e && e.code === 'quota_exceeded' ? 'Storage is full, so this change was not saved.' : 'This change was not saved. Check your connection and edit it again.');
  }
}

/* events */
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if(!b) return;
  view.tab = b.dataset.tab; view.status = ''; view.flag = ''; view.sort = null; view.kq = ''; $('kq').value = ''; render();
  $('gridwrap').scrollTop = 0; $('gridwrap').scrollLeft = 0;
});
$('heads').addEventListener('click', e => {
  const b = e.target.closest('[data-sort]'); if(!b) return;
  const k = b.dataset.sort;
  if(view.sort !== k){ view.sort = k; view.dir = (k === 'clicks' || k === 'impr') ? -1 : 1; }
  else if(view.dir === ((k === 'clicks' || k === 'impr') ? -1 : 1)){ view.dir = -view.dir; }
  else { view.sort = null; view.dir = 1; }
  render();
});
$('legend').addEventListener('click', e => {
  const b = e.target.closest('[data-status]'); if(!b) return;
  view.status = view.status === b.dataset.status ? '' : b.dataset.status; render();
});
$('summary').addEventListener('click', e => {
  const b = e.target.closest('[data-flag]'); if(!b) return;
  view.flag = view.flag === b.dataset.flag ? '' : b.dataset.flag;
  if(view.flag === 'clash'){ view.kq = ''; $('kq').value = ''; view.sort = null; }
  render();
});
$('q').addEventListener('input', e => { view.q = e.target.value; render(); });
$('kq').addEventListener('input', e => { view.kq = e.target.value; view.sort = null; render(); });
$('kwbar').addEventListener('click', e => { if(e.target.closest('#kwclear')){ view.kq = ''; $('kq').value = ''; if(view.flag === 'clash') view.flag = ''; view.sort = null; render(); } });
$('svc').addEventListener('change', e => { view.svc = e.target.value; render(); });

const tbody = $('tbody');
tbody.addEventListener('click', e => {
  if(e.target.closest('a')) return;
  const td = e.target.closest('td[data-col]'); if(td) showCell(td);
});
tbody.addEventListener('focusin', e => {
  const td = e.target.closest('td[data-col]'); if(td) showCell(td);
});
tbody.addEventListener('change', e => {
  if(!e.target.matches('.st')) return;
  const key = e.target.dataset.key;
  track[key] = Object.assign({}, track[key], {status: e.target.value});
  e.target.className = 'st s-' + e.target.value;
  renderProgress();
  save(key);
});
const noteTimers = {};
tbody.addEventListener('input', e => {
  if(!e.target.matches('.note')) return;
  grow(e.target);
  const key = e.target.dataset.key;
  track[key] = Object.assign({}, track[key], {note: e.target.value});
  clearTimeout(noteTimers[key]);
  noteTimers[key] = setTimeout(() => save(key), 800);
});
tbody.addEventListener('focusout', e => {
  if(!e.target.matches('.note')) return;
  const key = e.target.dataset.key;
  if(noteTimers[key]){ clearTimeout(noteTimers[key]); delete noteTimers[key]; save(key); }
});
tbody.addEventListener('keydown', e => {
  if(e.target.matches('.note') && e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); e.target.blur(); }
});

function applyRemote(){
  const active = document.activeElement;
  const typing = active && active.matches && active.matches('.note');
  if(view.status && !typing){ render(); return; }
  tbody.querySelectorAll('tr[data-key]').forEach(tr => {
    const r = ROWS.find(x => x.key === tr.dataset.key); if(!r) return;
    const sel = tr.querySelector('.st'); const s = statusOf(r);
    if(sel && sel !== active && sel.value !== s){ sel.value = s; sel.className = 'st s-' + s; }
    const ta = tr.querySelector('.note');
    if(ta && ta !== active && ta.value !== noteOf(r)){ ta.value = noteOf(r); grow(ta); }
  });
  renderProgress();
}

/* light / dark mode toggle, remembered per viewer */
const root = document.documentElement;
function currentMode(){
  const stamped = root.getAttribute('data-theme');
  if(stamped === 'light' || stamped === 'dark') return stamped;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function paintToggle(){
  const m = currentMode();
  document.querySelectorAll('.theme button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
}
function setMode(m){
  root.setAttribute('data-theme', m);
  try { localStorage.setItem('sheet-theme', m); } catch(e) {}
  paintToggle();
}
try { const saved = localStorage.getItem('sheet-theme'); if(saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved); } catch(e) {}
document.querySelector('.theme').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if(b) setMode(b.dataset.mode); });
if(window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintToggle);
new MutationObserver(paintToggle).observe(root, {attributes:true, attributeFilter:['data-theme']});
paintToggle();

render();
setSync('local', 'Changes stay on this screen only');

if(window.claude && typeof window.claude.use === 'function'){
  setSync('local', 'Connecting…');
  window.claude.use('db').then(d => {
    if(!d){ setSync('local', 'View only: changes are not saved here'); return; }
    db = d;
    db.collection('tracking').onSnapshot(snap => {
      snap.docs.forEach(doc => {
        const data = doc.data() || {};
        const typing = document.activeElement && document.activeElement.matches && document.activeElement.matches('.note[data-key="' + doc.id + '"]');
        track[doc.id] = typing ? Object.assign({}, data, {note: (track[doc.id] || {}).note}) : {status: data.status, note: data.note};
      });
      applyRemote();
      if($('sync').dataset.s !== 'saving') setSync('live', 'Shared sheet · saves automatically');
    }, () => setSync('error', 'Lost connection. Reload to keep editing'));
  });
}
</script>
